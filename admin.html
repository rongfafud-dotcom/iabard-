<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор — Ипатия Бард</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Georgia',serif;background:#0e0a0e;color:#e8ddd0;min-height:100vh;padding:24px 16px}
  h1{font-size:1.4rem;color:#c9a96e;letter-spacing:2px;text-align:center;margin-bottom:24px;font-weight:400}
  .token-section{max-width:600px;margin:0 auto 28px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.2);border-radius:10px;padding:20px}
  .token-section label{display:block;font-size:0.8rem;color:rgba(201,169,110,0.8);letter-spacing:1px;margin-bottom:8px}
  .token-row{display:flex;gap:10px}
  input[type=password],input[type=text]{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 14px;color:#e8ddd0;font-size:0.95rem;outline:none}
  input:focus{border-color:rgba(201,169,110,0.6)}
  button{background:rgba(201,169,110,0.15);border:1px solid rgba(201,169,110,0.4);border-radius:6px;color:#c9a96e;padding:10px 18px;cursor:pointer;font-size:0.9rem;transition:all 0.2s;white-space:nowrap}
  button:hover{background:rgba(201,169,110,0.28);border-color:#c9a96e}
  .tabs{max-width:600px;margin:0 auto 0;display:flex;gap:0}
  .tab-btn{flex:1;padding:12px;text-align:center;cursor:pointer;border:1px solid rgba(201,169,110,0.2);border-bottom:none;border-radius:8px 8px 0 0;background:rgba(255,255,255,0.03);color:rgba(201,169,110,0.6);font-size:0.85rem;letter-spacing:1px;transition:all 0.2s}
  .tab-btn.active{background:rgba(201,169,110,0.1);color:#c9a96e;border-color:rgba(201,169,110,0.4)}
  .editor-wrap{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;overflow:hidden}
  textarea{width:100%;height:65vh;background:#0a060a;color:#e8ddd0;border:none;padding:20px;font-family:'Georgia',serif;font-size:0.95rem;line-height:1.7;resize:none;outline:none}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(201,169,110,0.07);border-top:1px solid rgba(201,169,110,0.15)}
  .status{font-size:0.8rem;color:rgba(201,169,110,0.7);min-height:1.2em}
  .save-btn{background:#c9a96e;border:none;border-radius:6px;color:#0e0a0e;padding:10px 28px;cursor:pointer;font-size:0.95rem;font-weight:600;transition:opacity 0.2s}
  .save-btn:hover{opacity:0.85}
  .save-btn:disabled{opacity:0.4;cursor:not-allowed}
  .hint{max-width:600px;margin:16px auto 0;font-size:0.78rem;color:rgba(201,169,110,0.45);line-height:1.6;text-align:center}
  .token-ok{color:#7bc47b;font-size:0.8rem;margin-top:8px}
</style>
</head>
<body>

<h1>✦ Редактор контента ✦</h1>

<div class="token-section">
  <label>GitHub Personal Access Token</label>
  <div class="token-row">
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx">
    <button onclick="saveToken()">Сохранить</button>
  </div>
  <div id="token-status" class="token-ok"></div>
</div>

<div class="tabs">
  <div class="tab-btn active" onclick="switchFile('poems.txt',this)">📖 Стихи</div>
  <div class="tab-btn" onclick="switchFile('poem_queue.txt',this)">🎬 Очередь для Shorts</div>
</div>

<div class="editor-wrap">
  <textarea id="editor" placeholder="Загрузка…" spellcheck="false"></textarea>
  <div class="bar">
    <span class="status" id="status"></span>
    <button class="save-btn" id="save-btn" onclick="saveFile()" disabled>Сохранить</button>
  </div>
</div>

<div class="hint">
  Формат стихов: название → пустая строка → строфы → пустая строка → <strong>===</strong> → следующее стихотворение.<br>
  В «Стихах» новые добавляйте в <strong>начало</strong> файла. В «Очереди для Shorts» — в <strong>конец</strong>.
</div>

<script>
const REPO = 'rongfafud-dotcom/iabard-';
const API  = 'https://api.github.com/repos/' + REPO + '/contents/';

var currentFile = 'poems.txt';
var currentSha  = '';

function getToken(){
  return localStorage.getItem('gh_token') || document.getElementById('token').value.trim();
}

function saveToken(){
  var t = document.getElementById('token').value.trim();
  if(!t){setStatus('Введите токен');return;}
  localStorage.setItem('gh_token', t);
  document.getElementById('token-status').textContent = '✓ Токен сохранён';
  loadFile();
}

function setStatus(msg, ok){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = ok ? '#7bc47b' : 'rgba(201,169,110,0.7)';
}

function switchFile(file, btn){
  currentFile = file;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('editor').value = '';
  document.getElementById('save-btn').disabled = true;
  currentSha = '';
  loadFile();
}

function loadFile(){
  var token = getToken();
  if(!token){setStatus('Сначала введите токен');return;}
  setStatus('Загрузка…');
  fetch(API + currentFile + '?ref=main', {
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(data){
    currentSha = data.sha;
    var text = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    if(currentFile === 'poems.txt'){
      var parts = text.split('===').map(function(p){return p.trim();}).filter(Boolean);
      parts.reverse();
      text = '――――――――――――――――――――――――――\n\n' + parts.join('\n\n――――――――――――――――――――――――――\n\n') + '\n\n――――――――――――――――――――――――――\n';
    } else {
      var parts = text.split('===').map(function(p){return p.trim();}).filter(Boolean);
      text = '――――――――――――――――――――――――――\n\n' + parts.join('\n\n――――――――――――――――――――――――――\n\n') + '\n\n――――――――――――――――――――――――――\n';
    }
    document.getElementById('editor').value = text;
    document.getElementById('save-btn').disabled = false;
    setStatus('Загружено ✓', true);
  })
  .catch(function(e){
    setStatus('Ошибка загрузки: ' + e.message);
  });
}

function saveFile(){
  var token = getToken();
  if(!token){setStatus('Сначала введите токен');return;}
  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Сохранение…');
  var content = document.getElementById('editor').value;
  var SEP = '――――――――――――――――――――――――――';
  if(currentFile === 'poems.txt'){
    var parts = content.split(SEP).map(function(p){return p.trim();}).filter(Boolean);
    parts.reverse();
    content = parts.join('\n\n===\n\n') + '\n\n===\n';
  } else {
    content = content.split(SEP).map(function(p){return p.trim();}).filter(Boolean).join('\n\n===\n\n');
    if(content) content += '\n\n===\n';
  }
  var encoded = btoa(unescape(encodeURIComponent(content)));
  fetch(API + currentFile, {
    method:'PUT',
    headers:{
      'Authorization':'token '+token,
      'Accept':'application/vnd.github.v3+json',
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      message: 'Update ' + currentFile + ' via admin panel',
      content: encoded,
      sha: currentSha,
      branch: 'main'
    })
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
    return r.json();
  })
  .then(function(data){
    currentSha = data.content.sha;
    btn.disabled = false;
    setStatus('Сохранено ✓', true);
  })
  .catch(function(e){
    btn.disabled = false;
    setStatus('Ошибка: ' + e.message);
  });
}

// Init
(function(){
  var saved = localStorage.getItem('gh_token');
  if(saved){
    document.getElementById('token').value = saved;
    document.getElementById('token-status').textContent = '✓ Токен загружен из памяти';
    loadFile();
  }
})();
</script>
</body>
</html>
