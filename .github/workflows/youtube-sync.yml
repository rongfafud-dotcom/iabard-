name: YouTube Shorts Auto-Sync

on:
  schedule:
    - cron: '0 13 * * *'  # 09:00 Miami (EDT, UTC-4)
    - cron: '0 18 * * *'  # 14:00 Miami (EDT, UTC-4)
    - cron: '0 2  * * *'  # 22:00 Miami (EDT, UTC-4)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install -q yt-dlp

      - name: Sync latest Shorts
        run: python3 scripts/youtube_sync.py

      - name: Update sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|" sitemap.xml

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "youtube-sync[bot]"
          git config user.email "youtube-sync@iabard.com"
          git add index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-sync: latest Shorts from @ia_bard"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/rongfafud-dotcom/iabard-.git" HEAD:main
          fi
