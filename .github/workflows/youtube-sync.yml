name: YouTube Shorts Auto-Sync

on:
  schedule:
    - cron: '30 14 * * *'  # 10:30 Miami (EDT, UTC-4)
    - cron: '30 2  * * *'  # 22:30 Miami (EDT, UTC-4)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install -q yt-dlp

      - name: Sync latest Shorts
        run: python3 scripts/youtube_sync.py

      - name: Update sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|" sitemap.xml

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/rongfafud-dotcom/iabard-.git"
          git config user.name  "youtube-sync[bot]"
          git config user.email "youtube-sync@iabard.com"
          git add index.html sitemap.xml poem_queue.txt video_poems.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-sync: latest Shorts from @ia_bard"
            git pull --rebase "$REPO" main
            git push "$REPO" HEAD:main
            echo "Dispatching pages deployment..."
            curl -s -o /dev/null -w "Dispatch status: %{http_code}\n" \
              -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/rongfafud-dotcom/iabard-/actions/workflows/pages.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
