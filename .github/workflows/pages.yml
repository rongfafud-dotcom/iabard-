name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main → gh-pages
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git push origin HEAD:gh-pages --force

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate link-preview pages
        run: node tools/build-previews.js

      # Cards are committed, so most builds have none to draw and skip the
      # browser download entirely.
      - name: Any cards missing?
        id: cards
        run: |
          node -e "
          const fs=require('fs');
          const want=JSON.parse(fs.readFileSync('p/cards-input.json','utf8'));
          const missing=want.filter(x=>!fs.existsSync('cards/'+x.anchor+'.jpg')).length;
          console.log('missing: '+missing);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'missing='+missing+'\n');
          "

      - name: Install browser for cards
        if: steps.cards.outputs.missing != '0'
        run: npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Render missing cards
        if: steps.cards.outputs.missing != '0'
        run: node tools/make-cards.js

      - name: Re-link previews to the new cards
        if: steps.cards.outputs.missing != '0'
        run: node tools/build-previews.js

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # Printed last so it survives the artifact file listing in the log tail
      - name: Preview build summary
        if: always()
        run: cat p/build-info.json
