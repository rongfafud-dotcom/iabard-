<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Редактор — Ипатия Бард</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  input,textarea,select{font-size:16px!important}
  body{font-family:'Georgia',serif;background:#0e0a0e;color:#e8ddd0;min-height:100vh;padding:24px 16px}
  h1{font-size:1.4rem;color:#c9a96e;letter-spacing:2px;text-align:center;margin-bottom:24px;font-weight:400}
  .tabs{max-width:600px;margin:0 auto 0;display:flex;gap:0}
  .tab-btn{flex:1;padding:12px;text-align:center;cursor:pointer;border:1px solid rgba(201,169,110,0.2);border-bottom:none;border-radius:8px 8px 0 0;background:rgba(255,255,255,0.03);color:rgba(201,169,110,0.6);font-size:0.85rem;letter-spacing:1px;transition:all 0.2s}  .tab-btn.active{background:rgba(201,169,110,0.1);color:#c9a96e;border-color:rgba(201,169,110,0.4)}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(201,169,110,0.07);border-top:1px solid rgba(201,169,110,0.15)}
  .status{font-size:0.8rem;color:rgba(201,169,110,0.7);min-height:1.2em}
  .novinka-panel{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;padding:24px 20px;display:none}
  .novinka-status{font-size:0.82rem;color:rgba(201,169,110,0.8);min-height:1.2em;margin-top:12px}
  .novinka-add-btn{background:#c9a96e;border:none;border-radius:6px;color:#0e0a0e;padding:10px 28px;cursor:pointer;font-size:0.95rem;font-weight:600;transition:opacity 0.2s;width:100%}
  .novinka-add-btn:hover{opacity:0.85}
  .novinka-add-btn:disabled{opacity:0.4;cursor:not-allowed}
  .hint{max-width:600px;margin:16px auto 0;font-size:0.78rem;color:rgba(201,169,110,0.45);line-height:1.6;text-align:center}
  .token-ok{color:#7bc47b;font-size:0.8rem;margin-top:8px}
  .audio-panel{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;padding:24px 20px;display:none}
  .audio-upload-box{border:2px dashed rgba(201,169,110,0.3);border-radius:8px;padding:32px 20px;text-align:center;margin-bottom:24px;transition:border-color 0.2s}
  .audio-upload-box.drag{border-color:#c9a96e}
  .audio-upload-box input[type=file]{display:none}
  .audio-upload-box label{cursor:pointer;display:block}
  .audio-upload-icon{font-size:2.4rem;margin-bottom:10px}
  .audio-upload-text{font-size:0.9rem;color:rgba(201,169,110,0.7);margin-bottom:14px}
  .audio-progress{margin-top:14px;font-size:0.82rem;color:rgba(201,169,110,0.8);min-height:1.2em}
  .audio-list{display:flex;flex-direction:column;gap:10px}
  .audio-list-title{font-size:0.78rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(201,169,110,0.5);margin-bottom:4px}
  .audio-item{display:flex;flex-wrap:wrap;gap:8px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.15);border-radius:7px;padding:10px 14px}
  .audio-item-name{width:100%;font-size:0.85rem;word-break:break-word;color:rgba(232,221,208,0.9)}
  .audio-item audio{flex:1;min-width:0;height:32px}
  .audio-copy-btn{background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.3);border-radius:5px;color:#c9a96e;padding:5px 10px;cursor:pointer;font-size:0.75rem;white-space:nowrap;flex-shrink:0}
  .audio-del-btn{background:rgba(180,60,60,0.12);border:1px solid rgba(180,60,60,0.3);border-radius:5px;color:#d47a7a;padding:5px 9px;cursor:pointer;font-size:0.75rem;flex-shrink:0}
  .back-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 14px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.35);border-radius:8px;color:rgba(201,169,110,0.85);font-size:0.88rem;letter-spacing:0.5px;cursor:pointer;text-decoration:none;transition:all 0.2s;width:72px;height:38px;font-family:'Georgia',serif}
  .back-btn:hover{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,0.12)}
  .inner-back-btn{background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.3);border-radius:6px;color:rgba(201,169,110,0.8);padding:7px 14px;cursor:pointer;font-size:0.85rem;font-family:'Georgia',serif;flex-shrink:0;transition:all 0.2s;white-space:nowrap}
  .inner-back-btn:hover{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,0.12)}
  .top-bar{max-width:600px;margin:0 auto 16px;display:flex;align-items:center}
  .top-bar h1{flex:1;text-align:center;margin:0}
  .inbox-btn{background:transparent;border:1px solid rgba(201,169,110,0.3);border-radius:8px;color:rgba(201,169,110,0.6);padding:0;width:72px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0;position:relative}
  .inbox-btn:hover{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,0.08)}
  .inbox-btn.active{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,0.12)}
  .inbox-badge{position:absolute;top:-6px;right:-6px;background:#c9a96e;color:#0e0a0e;border-radius:9px;min-width:18px;height:18px;padding:0 4px;font-size:0.68rem;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
  .token-section{max-width:600px;margin:0 auto 20px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.2);border-radius:10px;overflow:hidden}
  .token-toggle{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
  .token-toggle-label{font-size:0.78rem;color:rgba(201,169,110,0.7);letter-spacing:1px;flex:1}
  .token-toggle-status{font-size:0.78rem;color:#7bc47b}
  .token-arrow{font-size:0.65rem;color:rgba(201,169,110,0.4);transition:transform 0.2s}
  .token-arrow.open{transform:rotate(180deg)}
  .token-body{padding:0 16px 16px;display:none}
  .token-row{display:flex;gap:10px}
  .inbox-panel{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:10px;padding:24px 20px;display:none}
  .inbox-msg{background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.15);border-radius:8px;padding:16px 18px;margin-bottom:12px;transition:opacity 0.4s}
  .inbox-msg-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
  .inbox-msg-name{font-size:0.9rem;color:#c9a96e;font-weight:600}
  .inbox-msg-date{font-size:0.73rem;color:rgba(201,169,110,0.5);white-space:nowrap}
  .inbox-msg-email{font-size:0.78rem;color:rgba(201,169,110,0.55);margin-bottom:10px}
  .inbox-contacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .inbox-contact-link{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;
    background:rgba(201,169,110,0.10);border:1px solid rgba(201,169,110,0.25);
    color:rgba(201,169,110,0.75);font-size:0.72rem;text-decoration:none;transition:all 0.2s}
  .inbox-contact-link:hover{background:rgba(201,169,110,0.20);border-color:#c9a96e;color:#c9a96e}
  .inbox-msg-text{font-size:0.87rem;color:rgba(232,221,208,0.85);line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .inbox-reply-btn{margin-top:12px;background:transparent;border:1px solid rgba(201,169,110,0.3);border-radius:5px;color:rgba(201,169,110,0.7);padding:5px 14px;cursor:pointer;font-size:0.75rem;transition:all 0.2s}
  .inbox-reply-btn:hover{border-color:#c9a96e;color:#c9a96e}
  .inbox-reply-menu{margin-top:6px;background:#1e1220;border:1px solid rgba(201,169,110,0.25);border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.55)}
  .inbox-reply-menu a{display:block;padding:9px 16px;color:rgba(253,246,238,0.80);text-decoration:none;font-size:0.78rem;transition:background 0.15s;white-space:nowrap}
  .inbox-reply-menu a+a{border-top:1px solid rgba(201,169,110,0.10)}
  .inbox-reply-menu a:hover{background:rgba(201,169,110,0.08);color:#c9a96e}
  .inbox-reply-box{margin-top:10px;display:none}
  .inbox-reply-box textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 12px;color:#e8ddd0;font-family:'Georgia',serif;font-size:0.85rem;line-height:1.6;resize:vertical;outline:none;min-height:80px}
  .inbox-reply-box textarea:focus{border-color:rgba(201,169,110,0.5)}
  .inbox-send-btn{margin-top:8px;background:#c9a96e;border:none;border-radius:5px;color:#0e0a0e;padding:7px 20px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:opacity 0.2s}
  .inbox-send-btn:hover{opacity:0.85}
  .inbox-send-btn:disabled{opacity:0.4;cursor:not-allowed}
  .inbox-replies{margin-top:14px;border-top:1px solid rgba(201,169,110,0.1);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .inbox-reply-item{background:rgba(201,169,110,0.04);border-left:2px solid rgba(201,169,110,0.3);padding:8px 12px;border-radius:0 6px 6px 0}
  .inbox-reply-item-date{font-size:0.7rem;color:rgba(201,169,110,0.4);margin-bottom:4px}
  .inbox-reply-item-text{font-size:0.83rem;color:rgba(232,221,208,0.8);white-space:pre-wrap;word-break:break-word}
  .inbox-empty{font-size:0.88rem;color:rgba(201,169,110,0.4);text-align:center;padding:40px 0}
  .inbox-refresh{width:100%;margin-top:18px;margin-bottom:0}
  .inbox-tabs{display:flex;margin-bottom:12px;border-bottom:1px solid rgba(201,169,110,0.2)}
  .inbox-archive-all{width:100%;margin-bottom:16px;background:transparent;border:1px solid rgba(100,180,100,0.35);border-radius:6px;color:rgba(120,200,120,0.75);padding:8px;cursor:pointer;font-size:0.78rem;letter-spacing:0.5px;transition:all 0.2s}
  .inbox-archive-all:hover{border-color:#7bc47b;color:#7bc47b}
  .inbox-tab-btn{flex:1;padding:10px;text-align:center;cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;color:rgba(201,169,110,0.5);font-size:0.85rem;letter-spacing:1px;transition:all 0.2s;margin-bottom:-1px;font-family:'Georgia',serif}
  .inbox-tab-btn.active{color:#c9a96e;border-bottom-color:#c9a96e}
  .inbox-tab-btn:hover{color:rgba(201,169,110,0.8)}
  #poem-yt-url::placeholder,#poem-add-text::placeholder,#poem-mp3-input::placeholder,
  #en-url::placeholder,#en-text::placeholder,#en-title::placeholder,
  #astro-url::placeholder,#astro-text::placeholder,#astro-title::placeholder,
  #author-url::placeholder,#author-text::placeholder,#author-title::placeholder{color:rgba(232,221,208,0.5)}
  .inbox-close-btn{float:right;background:transparent;border:1px solid rgba(100,180,100,0.3);border-radius:5px;color:rgba(120,200,120,0.65);padding:5px 12px;cursor:pointer;font-size:0.72rem;transition:all 0.2s}
  .inbox-close-btn:hover{border-color:#7bc47b;color:#7bc47b}
  .inbox-del-btn{float:right;margin-right:8px;background:transparent;border:1px solid rgba(180,60,60,0.3);border-radius:5px;color:rgba(200,100,100,0.65);padding:5px 12px;cursor:pointer;font-size:0.72rem;transition:all 0.2s}
  .inbox-del-btn:hover{border-color:#d47a7a;color:#d47a7a}

  #back-to-top{position:fixed;bottom:80px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(92,61,85,0.88);border:1px solid rgba(201,169,110,0.45);color:#c9a96e;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
  #back-to-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
  #back-to-top:hover{background:#5c3d55;border-color:#c9a96e;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
  #back-to-top svg{width:18px;height:18px;fill:currentColor}
  .poem-search{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(201,169,110,0.04);border-bottom:1px solid rgba(201,169,110,0.15)}
  .poem-search input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.2);border-radius:6px;padding:7px 12px;color:#e8ddd0;font-size:0.85rem;outline:none;font-family:'Georgia',serif}
  .poem-search input:focus{border-color:rgba(201,169,110,0.5)}
  .poem-search-count{font-size:0.72rem;color:rgba(201,169,110,0.4);white-space:nowrap}
  .pcard{border-bottom:1px solid rgba(201,169,110,0.1)}
  .pcard:last-child{border-bottom:none}
  .pcard-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background 0.15s;user-select:none;-webkit-user-select:none}
  .pcard-head:hover{background:rgba(201,169,110,0.06)}
  .pcard-title{flex:1;font-size:0.88rem;color:rgba(201,169,110,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard-arrow{font-size:0.6rem;color:rgba(201,169,110,0.35);transition:transform 0.2s;flex-shrink:0}
  .pcard-arrow.open{transform:rotate(180deg)}
  .pcard-body{display:none;padding:0 16px 14px}
  .pcard-ta{width:100%;min-height:160px;background:#0a060a;color:#e8ddd0;border:1px solid rgba(201,169,110,0.2);border-radius:6px;padding:11px 14px;font-family:'Georgia',serif;font-size:0.88rem;line-height:1.7;resize:vertical;outline:none;-webkit-user-select:text;user-select:text;display:block}
  .pcard-ta:focus{border-color:rgba(201,169,110,0.4)}
  .pcard-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 0 0}
  .pcard-status{font-size:0.76rem;color:rgba(201,169,110,0.7);min-height:1.2em}
  .pcard-save{background:#c9a96e;border:none;border-radius:5px;color:#0e0a0e;padding:7px 18px;cursor:pointer;font-size:0.83rem;font-weight:600;transition:opacity 0.2s}
  .pcard-save:hover{opacity:0.85}
  .pcard-save:disabled{opacity:0.4;cursor:not-allowed}
  .pcard-del{background:transparent;border:1px solid rgba(180,60,60,0.35);border-radius:5px;color:rgba(200,100,100,0.7);padding:7px 12px;cursor:pointer;font-size:0.83rem;transition:all 0.2s}
  .pcard-del:hover{border-color:#d47a7a;color:#d47a7a}
  .pcard-del:disabled{opacity:0.4;cursor:not-allowed}
  .yt-panel{max-width:600px;margin:0 auto;display:none}
  .yt-search-wrap{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(201,169,110,0.04);border:1px solid rgba(201,169,110,0.3);border-bottom:none;border-radius:10px 10px 0 0}
  .yt-search-wrap input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.2);border-radius:6px;padding:7px 12px;color:#e8ddd0;outline:none;font-family:'Georgia',serif}
  .yt-count{font-size:0.72rem;color:rgba(201,169,110,0.4);white-space:nowrap}
  .yt-list{border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;overflow:hidden}
  .yt-item{padding:12px 16px;border-bottom:1px solid rgba(201,169,110,0.1);transition:border-top 0.1s,border-bottom 0.1s}
  .yt-item:last-child{border-bottom:none}
  .yt-item.drag-over-above{border-top:2px solid #c9a96e !important}
  .yt-item.drag-over-below{border-bottom:2px solid #c9a96e !important}
  .yt-item.is-dragging{opacity:0.35}
  .drag-grip{color:rgba(201,169,110,0.3);cursor:grab;flex-shrink:0;display:flex;align-items:center;padding:0 8px 0 0;touch-action:none;user-select:none}
  .drag-grip:active{cursor:grabbing;color:rgba(201,169,110,0.7)}
  .yt-item-title{font-size:0.88rem;color:rgba(201,169,110,0.85);margin-bottom:8px}
  .yt-item-row{display:flex;gap:8px;align-items:center}
  .yt-item-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.2);border-radius:6px;padding:7px 10px;color:#e8ddd0;font-family:'Georgia',serif;outline:none;min-width:0}
  .yt-item-input:focus{border-color:rgba(201,169,110,0.5)}
  .yt-item-btn{background:#c9a96e;border:none;border-radius:5px;color:#0e0a0e;padding:7px 14px;cursor:pointer;font-size:0.82rem;font-weight:600;white-space:nowrap;flex-shrink:0}
  .yt-item-btn:disabled{opacity:0.4;cursor:not-allowed}
  .yt-item-status{font-size:0.74rem;color:rgba(201,169,110,0.7);margin-top:5px;min-height:1em}
  .yt-item-audio{display:flex;align-items:center;gap:8px;margin-top:7px}
  .yt-item-audio-label{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(201,169,110,0.2);border-radius:6px;padding:6px 10px;color:rgba(232,221,208,0.5);font-size:0.8rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yt-item-audio-label:hover{border-color:rgba(201,169,110,0.45)}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn">← Сайт</a>
  <h1>✦ Редактор ✦</h1>
  <button class="inbox-btn" id="inbox-btn" onclick="switchInbox()" title="Входящие сообщения">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    <span class="inbox-badge" id="inbox-badge"></span>
  </button>
</div>

<div class="token-section" id="token-section">
  <div class="token-toggle" onclick="toggleToken()">
    <span class="token-toggle-label">GitHub Token</span>
    <span class="token-toggle-status" id="token-status"></span>
    <span class="token-arrow" id="token-arrow">▼</span>
  </div>
  <div class="token-body" id="token-body">
    <div class="token-row">
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx">
      <button onclick="saveToken()">Сохранить</button>
    </div>
  </div>
</div>

<div class="tabs" style="max-width:600px;margin:0 auto">
  <button class="tab-btn active" id="mode-tab-add" onclick="setMode('add',this)">Добавить</button>
  <button class="tab-btn" id="mode-tab-edit" onclick="setMode('edit',this)">Редактировать</button>
</div>
<div id="main-panel" style="max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;overflow:hidden">

  <!-- ДОБАВИТЬ -->
  <div id="mode-add" style="display:block">

  <!-- выбор рубрики -->
  <div id="add-section-picker" style="padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;color:rgba(201,169,110,0.45);text-align:center;padding-bottom:4px">Выберите рубрику</div>
    <button onclick="selectAddSection('poems')" style="background:rgba(201,169,110,0.07);border:1px solid rgba(201,169,110,0.25);border-radius:8px;color:#e8ddd0;font-family:'Georgia',serif;font-size:1rem;letter-spacing:1px;padding:16px 20px;cursor:pointer;text-align:left;transition:all 0.2s;display:flex;align-items:center;gap:12px" onmouseover="this.style.borderColor='rgba(201,169,110,0.6)';this.style.background='rgba(201,169,110,0.12)'" onmouseout="this.style.borderColor='rgba(201,169,110,0.25)';this.style.background='rgba(201,169,110,0.07)'">
      <span style="font-size:1.3rem">📜</span><span style="color:#c9a96e;font-size:1.05rem">Поэзия</span>
    </button>

<script>
const REPO = 'rongfafud-dotcom/iabard-';
const API  = 'https://api.github.com/repos/' + REPO + '/contents/';
function b64d(s){return new TextDecoder().decode(Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}));}
function b64e(s){return btoa(Array.from(new TextEncoder().encode(s),function(b){return String.fromCharCode(b);}).join(''));}

var currentFile = 'poems.txt';
var currentInboxTab = 'open';
var poemParts = [];

function switchInboxTab(tab){
  currentInboxTab=tab;
  document.getElementById('inbox-tab-open').classList.toggle('active',tab==='open');
  document.getElementById('inbox-tab-closed').classList.toggle('active',tab==='closed');
  document.getElementById('inbox-archive-all-btn').style.display=tab==='open'?'block':'none';
  loadInbox();
}

function archiveAll(){
  var token=getToken();
  if(!token){alert('Сначала введите токен');return;}
  var msgs=document.querySelectorAll('#inbox-list .inbox-msg');
  if(!msgs.length)return;
  if(!confirm('Архивировать все сообщения ('+msgs.length+')?'))return;
  var btn=document.getElementById('inbox-archive-all-btn');
  btn.disabled=true;btn.textContent='Архивирование…';
  var nums=Array.from(msgs).map(function(m){return m.dataset.issue;}).filter(Boolean);
  Promise.all(nums.map(function(num){
    return fetch('https://api.github.com/repos/'+REPO+'/issues/'+num,{
      method:'PATCH',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({state:'closed'})
    }).then(function(r){
      if(r.status===401){invalidToken();throw new Error('Неверный токен');}
      if(!r.ok)throw new Error('HTTP '+r.status+' для #'+num);
      return r;
    });
  })).then(function(){
    btn.disabled=false;btn.textContent='✓ Архивировать все сообщения';
    loadInbox();
  }).catch(function(e){
    btn.disabled=false;btn.textContent='✓ Архивировать все сообщения';
    alert('Ошибка: '+e.message);
  });
}

function getToken(){
  return localStorage.getItem('gh_token') || document.getElementById('token').value.trim();
}

function toggleToken(){
  var body=document.getElementById('token-body');
  var arrow=document.getElementById('token-arrow');
  var open=body.style.display==='block';
  body.style.display=open?'none':'block';
  arrow.classList.toggle('open',!open);
}

function saveToken(){
  var t = document.getElementById('token').value.trim();
  if(!t){setStatus('Введите токен');return;}
  localStorage.setItem('gh_token', t);
  document.getElementById('token-status').textContent = '✓';
  document.getElementById('token-body').style.display='none';
  document.getElementById('token-arrow').classList.remove('open');
  loadFile();
}

function invalidToken(){
  localStorage.removeItem('gh_token');
  document.getElementById('token').value = '';
  document.getElementById('token-status').textContent = '';
  document.getElementById('token-body').style.display='block';
  document.getElementById('token-arrow').classList.add('open');
  setStatus('Токен недействителен — введите новый');
}

function checkR(r){
  if(r.status===401){invalidToken();throw new Error('skip');}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r;
}

function setStatus(msg, ok){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = ok ? '#7bc47b' : 'rgba(201,169,110,0.7)';
}

function switchAdd(btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});

    if(f) f.style.display=(s===section)?'flex':'none';
  });
  if(section==='poetry-en') loadPoetryENList();
  if(section==='astrology') loadAstroList();
}
function uploadPoemAudio(files){
  if(!files||!files.length)return;
  var token=getToken();
  var prog=document.getElementById('poem-mp3-progress');
  if(!token){prog.textContent='Нет токена';prog.style.display='block';return;}
  var fileArr=Array.prototype.slice.call(files);
  var total=fileArr.length;
  var firstSafe=null;
  prog.style.display='block';prog.style.color='rgba(201,169,110,0.7)';
  prog.textContent=total>1?'[1/'+total+'] Загрузка…':'Загрузка…';
  function uploadOne(idx){
    if(idx>=total){
      prog.style.color='#7bc47b';
      prog.textContent=total>1?'✓ Загружено: '+total+' файла':'✓ Загружено: '+firstSafe;
      return;
    }
    var file=fileArr[idx];
    if(file.size>25*1024*1024){prog.style.color='#d47a7a';prog.textContent='Файл '+file.name+' больше 25MB';uploadOne(idx+1);return;}
    if(total>1)prog.textContent='['+(idx+1)+'/'+total+'] '+file.name+'…';
    var reader=new FileReader();
    reader.onload=function(e){
      var arr=new Uint8Array(e.target.result);
      var chunks=[];
      for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
      var b64=btoa(chunks.join(''));
      var safeName=sanitizeFilename(file.name,'audio');
      if(idx===0)firstSafe=safeName;
      var path='audio/'+safeName;
      fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      })
      .then(function(r){return r.json();})
      .then(function(ex){
        var body={message:'Upload audio: '+safeName,content:b64,branch:'main'};
        if(ex&&ex.sha&&!ex.message)body.sha=ex.sha;
        return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
          method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
      })
      .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
      .then(function(){
        if(idx===0){
          document.getElementById('poem-mp3-input').value=firstSafe;
          document.getElementById('poem-mp3-name').textContent=firstSafe;
          document.getElementById('poem-mp3-name').style.color='#e8ddd0';
          document.getElementById('poem-mp3-clear').style.display='inline';
        }
        uploadOne(idx+1);
      })
      .catch(function(e){prog.style.color='#d47a7a';prog.textContent='Ошибка: '+e.message;uploadOne(idx+1);});
    };
    reader.readAsArrayBuffer(file);
  }
  uploadOne(0);
}
function clearPoemMp3(){
  document.getElementById('poem-mp3-input').value='';
  document.getElementById('poem-mp3-name').textContent='MP3 файл';
  document.getElementById('poem-mp3-name').style.color='';
  document.getElementById('poem-mp3-clear').style.display='none';
  document.getElementById('poem-mp3-progress').style.display='none';
  document.getElementById('poem-mp3-file').value='';
}
var _shopImages=[];
function _shopUploadStatus(st,b,errMsg){
  var done=(b.ok||0)+(b.err||0);
  if(done<b.t){st.style.color='rgba(201,169,110,0.7)';st.textContent='Загрузка '+done+' из '+b.t+'…';}
  else if(b.err){st.style.color='#d47a7a';st.textContent=(b.ok?b.ok+' загружено, ':'')+b.err+' с ошибкой'+(errMsg?': '+errMsg:'');}
  else{st.style.color='#7bc47b';st.textContent='✓ Загружено '+b.ok+(b.ok===1?' фото':' фото');}
}
function uploadShopImage(file,_batch){
  if(!file)return;
  var token=getToken();
  var st=document.getElementById('shop-img-status');
  if(!token){st.style.display='block';st.style.color='#d47a7a';st.textContent='Нет токена';return;}
  if(file.size>10*1024*1024){st.style.display='block';st.style.color='#d47a7a';st.textContent='Файл больше 10MB';return;}
  st.style.display='block';st.style.color='rgba(201,169,110,0.7)';
  st.textContent=(_batch&&_batch.t>1)?'Загрузка…':'Загрузка…';
  var reader=new FileReader();
  reader.onload=function(e){
    var arr=new Uint8Array(e.target.result);
    var chunks=[];
    for(var i=0;i<arr.length;i+=8192)chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));
    var b64=btoa(chunks.join(''));
    var ext=file.name.split('.').pop().toLowerCase()||'jpg';
    var path='images/shop/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
    fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    })
    .then(function(r){return r.json();})
    .then(function(ex){
      var body={message:'Upload shop image',content:b64,branch:'main'};
      if(ex&&ex.sha&&!ex.message)body.sha=ex.sha;
      return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
        method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
    })
    .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
    .then(function(){
      if(_batch){_batch.ok=(_batch.ok||0)+1;_shopUploadStatus(st,_batch);}
      else{st.style.color='#7bc47b';st.textContent='✓ Фото загружено';}
      var list=document.getElementById('shop-img-list');
      var item=document.createElement('div');
      item.style.cssText='display:flex;align-items:center;gap:8px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.2);border-radius:6px;padding:6px 10px';
      var imgEl=document.createElement('img');imgEl.src=URL.createObjectURL(file);
      imgEl.style.cssText='width:44px;height:44px;object-fit:cover;border-radius:4px;flex-shrink:0';
      var lbl=document.createElement('span');
      lbl.style.cssText='flex:1;font-size:0.78rem;color:rgba(232,221,208,0.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      lbl.textContent=path;
      var rm=document.createElement('button');rm.type='button';
      rm.style.cssText='background:none;border:none;color:rgba(201,169,110,0.45);cursor:pointer;font-size:0.9rem;padding:2px 4px;flex-shrink:0';
      rm.textContent='✕';
      rm.onclick=(function(el,p){return function(){_shopImages=_shopImages.filter(function(x){return x!==p;});el.remove();};})(item,path);
      item.appendChild(imgEl);item.appendChild(lbl);item.appendChild(rm);
      list.appendChild(item);
      _shopImages.push(path);
    })
    .catch(function(err){
      if(_batch){_batch.err=(_batch.err||0)+1;_shopUploadStatus(st,_batch,err.message);}
      else{st.style.color='#d47a7a';st.textContent='Ошибка: '+err.message;}
    });
  };
  reader.readAsArrayBuffer(file);
}
function addShop(){
  var token=getToken();
  if(!token){document.getElementById('shop-add-status').textContent='Нет токена';return;}
  var title=document.getElementById('shop-title').value.trim();
  var url=document.getElementById('shop-url').value.trim();
  var text=document.getElementById('shop-text').value.trim();
  var price=document.getElementById('shop-price').value.trim();
  var imagesRaw=_shopImages.slice();
  if(!title){document.getElementById('shop-add-status').textContent='Введите название';return;}
  var st=document.getElementById('shop-add-status');
  st.textContent='Сохранение…';st.style.color='rgba(201,169,110,0.7)';
  fetch('https://api.github.com/repos/'+REPO+'/contents/shop.txt?ref=main',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.status===404?{sha:null,content:btoa('')}:r.json();})
  .then(function(d){
    var existing=d.sha?b64d(d.content.replace(/\n/g,'')):'';
    var imgLines=imagesRaw.map(function(src){return '# image: '+src;}).join('\n');
    var newEntry=(imgLines?imgLines+'\n':'')+title+(url?'\n\n'+url:'')+(text?'\n\n'+text:'')+(price?'\n\nЦена: '+price:'')+'\n';
    var updated=existing.trim()?'===\n\n'+newEntry+'\n'+existing.trim()+'\n':'===\n\n'+newEntry+'\n===\n';
    var encoded=btoa(unescape(encodeURIComponent(updated)));
    var body={message:'Add shop item: '+title,content:encoded,branch:'main'};
    if(d.sha)body.sha=d.sha;
    return fetch('https://api.github.com/repos/'+REPO+'/contents/shop.txt',{
      method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
  .then(function(){
    st.textContent='✓ Добавлено!';st.style.color='#7bc47b';
    document.getElementById('shop-title').value='';
    document.getElementById('shop-url').value='';
    document.getElementById('shop-text').value='';
    document.getElementById('shop-price').value='';

function loadPoetryENList(){

  .then(function(d){
    var text=b64d(d.content.replace(/\n/g,''));
    var entries=text.split('===').map(function(e){return e.trim();}).filter(Boolean).reverse();

function _uploadAudioSection(pfx,files){
  if(!files||!files.length)return;
  var token=getToken();
  var prog=document.getElementById(pfx+'-mp3-progress');
  if(!token){prog.style.display='block';prog.textContent='Нет токена';return;}
  var fileArr=Array.prototype.slice.call(files);
  var total=fileArr.length;
  var firstSafe=null;
  prog.style.display='block';prog.style.color='rgba(201,169,110,0.7)';
  prog.textContent=total>1?'[1/'+total+'] Загрузка…':'Загрузка…';
  function uploadOne(idx){
    if(idx>=total){
      prog.style.color='#7bc47b';
      prog.textContent=total>1?'✓ Загружено: '+total+' файла':'✓ Загружено: '+firstSafe;
      return;
    }
    var file=fileArr[idx];
    if(file.size>25*1024*1024){prog.style.color='#d47a7a';prog.textContent='Файл '+file.name+' больше 25MB';uploadOne(idx+1);return;}
    if(total>1)prog.textContent='['+(idx+1)+'/'+total+'] '+file.name+'…';
    var reader=new FileReader();
    reader.onload=function(e){
      var arr=new Uint8Array(e.target.result);
      var chunks=[];
      for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
      var b64=btoa(chunks.join(''));
      var safeName=sanitizeFilename(file.name,'audio');
      if(idx===0)firstSafe=safeName;
      var path='audio/'+safeName;
      fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      })
      .then(function(r){return r.json();})
      .then(function(ex){
        var body={message:'Upload audio: '+safeName,content:b64,branch:'main'};
        if(ex&&ex.sha&&!ex.message)body.sha=ex.sha;
        return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
          method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
      })
      .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
      .then(function(){
        if(idx===0){
          document.getElementById(pfx+'-mp3-input').value=firstSafe;
          document.getElementById(pfx+'-mp3-name').textContent=firstSafe;
          document.getElementById(pfx+'-mp3-name').style.color='#e8ddd0';
          document.getElementById(pfx+'-mp3-clear').style.display='inline';
        }
        uploadOne(idx+1);
      })
      .catch(function(e){prog.style.color='#d47a7a';prog.textContent='Ошибка: '+e.message;uploadOne(idx+1);});
    };
    reader.readAsArrayBuffer(file);
  }
  uploadOne(0);
}

function _saveAstroFile(token,entries,message,onSuccess,onError){
  fetch('https://api.github.com/repos/'+REPO+'/contents/astrology.txt?ref=main',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.status===404?{sha:null,notFound:true}:r.json();})
  .then(function(d){
    var content=entries.length?entries.reverse().join('\n\n===\n\n')+'\n\n===\n':'';
    var encoded=btoa(unescape(encodeURIComponent(content)));
    var body={message:message,content:encoded,branch:'main'};
    if(d.sha)body.sha=d.sha;
    entries.reverse();
    return fetch('https://api.github.com/repos/'+REPO+'/contents/astrology.txt',{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
  .then(onSuccess).catch(onError);
}

function saveYTEntry(title,url,audioFile,imageFile,btn,status){
  if(!url&&!audioFile&&!imageFile){status.textContent='Добавьте ссылку, MP3 или картинку';status.style.color='#d47a7a';return;}
  if(url&&!/^https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)/i.test(url)){status.textContent='Неверная YouTube-ссылка';status.style.color='#d47a7a';return;}
  var token=getToken();
  if(!token){status.textContent='Нет токена';status.style.color='#d47a7a';return;}
  btn.disabled=true;status.style.color='rgba(201,169,110,0.7)';

  var uploadAudioPromise=Promise.resolve(null);
  if(audioFile){
    status.textContent='Загрузка аудио…';
    uploadAudioPromise=new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(e){
        var arr=new Uint8Array(e.target.result);
        var chunks=[];
        for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
        var b64=btoa(chunks.join(''));
        var safeName=sanitizeFilename(audioFile.name,'audio');
        var path='audio/'+safeName;
        fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
          headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
        })
        .then(function(r){return r.json();})
        .then(function(existing){
          var body={message:'Upload audio: '+safeName,content:b64,branch:'main'};
          if(existing&&existing.sha&&!existing.message)body.sha=existing.sha;
          return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
            method:'PUT',
            headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
            body:JSON.stringify(body)
          });
        })
        .then(function(r){
          if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
          var ts=JSON.parse(localStorage.getItem('audio_ts')||'{}');
          ts[safeName]=Date.now();
          localStorage.setItem('audio_ts',JSON.stringify(ts));
          resolve(safeName);
        })
        .catch(reject);
      };
      reader.readAsArrayBuffer(audioFile);
    });
  }

  var uploadImagePromise=Promise.resolve(null);
  if(imageFile){
    uploadImagePromise=new Promise(function(resolve,reject){
      uploadPoemImage(imageFile,resolve,reject);
    });
  }

  Promise.all([uploadAudioPromise,uploadImagePromise]).then(function(results){
    var safeName=results[0];var imgName=results[1];
    status.textContent='Обновление стихотворения…';
    return fetch('https://api.github.com/repos/'+REPO+'/contents/poems.txt?ref=main',{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    })
    .then(function(r){return r.json();})
    .then(function(d){
      var text=b64d(d.content.replace(/\n/g,''));
      var sha=d.sha;
      var sections=text.split('===');
      var found=false;
      var newSections=sections.map(function(sec){
        var trimmed=sec.trim();
        if(!trimmed)return sec;
        var clean=trimmed.replace(/[ \t]*#\s+[^\n]*/g,'').trim();
        var firstLine=clean.split('\n')[0]||'';
        if(firstLine.trim()===title){
          found=true;
          var addition='';
          if(imgName)addition+='\n# image: '+imgName;
          if(safeName)addition+='\n# audio: '+safeName;
          if(url)addition+='\n\n'+url;
          return sec.trimEnd()+addition+'\n';
        }
        return sec;
      });
      if(!found){status.textContent='Стихотворение не найдено';status.style.color='#d47a7a';btn.disabled=false;return Promise.resolve(null);}
      var newText=newSections.join('===');
      var encoded=btoa(unescape(encodeURIComponent(newText)));
      return fetch('https://api.github.com/repos/'+REPO+'/contents/poems.txt',{
        method:'PUT',
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify({message:'Add media to: '+title,content:encoded,sha:sha,branch:'main'})
      });
    });
  })
  .then(function(r){
    if(!r)return;
    if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
    status.textContent='✓ Сохранено!';status.style.color='#7bc47b';
    btn.closest('.yt-item').style.opacity='0.4';
    btn.disabled=true;
  })
  .catch(function(e){status.textContent='Ошибка: '+e.message;status.style.color='#d47a7a';btn.disabled=false;});
}

function sanitizeFilename(name,fallback){
  return name.replace(/[^\wЀ-ӿ.\-]/g,'_').replace(/\.{2,}/g,'_').replace(/^[._\-]+/,'') || fallback;
}

function uploadAudio(file){
  if(!file)return;
  var token=getToken();
  if(!token){setAudioProgress('Сначала введите токен');return;}
  if(file.size>25*1024*1024){setAudioProgress('Файл больше 25MB — GitHub не принимает такие файлы. Сожми MP3.');return;}
  var mb=Math.round(file.size/1024/1024*10)/10;
  setAudioProgress('Чтение файла ('+mb+' MB)…');
  var reader=new FileReader();
  reader.onerror=function(){setAudioProgress('Ошибка чтения файла');};
  reader.onload=function(e){
    var arr=new Uint8Array(e.target.result);
    var chunks=[];
    for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
    var b64=btoa(chunks.join(''));
    setAudioProgress('Отправка на GitHub…');
    var safeName=sanitizeFilename(file.name,'audio');
    var path='audio/'+safeName;
    fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    })
    .then(function(r){return r.json();})
    .then(function(existing){
      var body={message:'Upload audio: '+safeName,content:b64,branch:'main'};
      if(existing&&existing.sha&&!existing.message)body.sha=existing.sha;
      return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
        method:'PUT',
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
    })
    .then(function(r){
      if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
      return r.json();
    })
    .then(function(data){
      setAudioProgress('✓ Загружено: '+safeName, true);
      document.getElementById('audio-file-input').value='';
      var ts=JSON.parse(localStorage.getItem('audio_ts')||'{}');
      ts[safeName]=Date.now();
      localStorage.setItem('audio_ts',JSON.stringify(ts));
      var url=(data&&data.content&&data.content.download_url)||('https://raw.githubusercontent.com/'+REPO+'/main/audio/'+safeName);
      var sha=(data&&data.content&&data.content.sha)||'';
      var list=document.getElementById('audio-list');
      if(!list.querySelector('.audio-item'))list.innerHTML='';
      var item=document.createElement('div');item.className='audio-item';
      var nameSpan=document.createElement('span');nameSpan.className='audio-item-name';nameSpan.textContent=safeName;
      var audio=document.createElement('audio');audio.controls=true;audio.src=url;
      var copyBtn=document.createElement('button');copyBtn.className='audio-copy-btn';copyBtn.textContent='Копировать тег';
      copyBtn.addEventListener('click',function(){copyAudioTag(safeName);});
      var delBtn=document.createElement('button');delBtn.className='audio-del-btn';delBtn.textContent='✕';
      delBtn.addEventListener('click',function(){deleteAudio(safeName,sha);});
      item.appendChild(nameSpan);item.appendChild(audio);item.appendChild(copyBtn);item.appendChild(delBtn);
      list.insertBefore(item,list.firstChild);
    })
    .catch(function(e){setAudioProgress('Ошибка: '+e.message);});
  };
  reader.readAsArrayBuffer(file);
}

function deleteAudio(filename,sha){
  if(!confirm('Удалить '+filename+'?'))return;
  var token=getToken();
  if(!token){setAudioProgress('Сначала введите токен');return;}
  fetch('https://api.github.com/repos/'+REPO+'/contents/audio/'+encodeURIComponent(filename),{

function savePoemEntry(poemText, audioFilename, imageFilename){
  var token=getToken();
  if(_writeBusy){
    document.getElementById('poem-add-btn').disabled=false;
    setPoemAddStatus('Подождите, идёт запись…');
    return;
  }
  _writeBusy=true;
  var ytUrl=document.getElementById('poem-yt-url').value.trim();
  var lines=poemText.split('\n');
  var title=lines[0];
  var restLines=lines.slice(1);
  // Strip only leading blank lines (not blank lines between stanzas)
  while(restLines.length && restLines[0].trim()==='') restLines.shift();
  var rest=restLines.join('\n').trimEnd();
  var extras='';
  if(audioFilename) extras+='\n\n# audio: '+audioFilename;
  if(imageFilename) extras+='\n\n# image: '+imageFilename;
  if(ytUrl) extras+='\n\n'+ytUrl;
  // (subtitle) stays in same stanza as title; everything else gets blank-line separator
  var sep=rest&&rest.charAt(0)==='('?'\n':'\n\n';
  var finalPoem=title+(rest?sep+rest:'')+extras;
  fetch(API+'poems.txt?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var sha=data.sha;
    var content=b64d(data.content.replace(/\n/g,''));
    content=content.trimEnd()+'\n\n===\n\n'+finalPoem+'\n\n===\n';
    var encoded=b64e(content);
    return fetch(API+'poems.txt',{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Add poem: '+title,content:encoded,sha:sha,branch:'main'})});
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
  .then(function(){
    document.getElementById('poem-add-btn').disabled=false;
    document.getElementById('poem-add-text').value='';
    document.getElementById('poem-yt-url').value='';
    clearPoemMp3();
    clearPoemImage();
    setPoemAddStatus('✓ Стихотворение добавлено!',true);
    if(currentFile==='poems.txt'){
      loadFile(function(){_writeBusy=false;});
    } else {
      _writeBusy=false;
    }
  })
  .catch(function(e){_writeBusy=false;document.getElementById('poem-add-btn').disabled=false;setPoemAddStatus('Ошибка: '+e.message);});
}

var _ALLOWED_IMG=['image/jpeg','image/png','image/webp','image/gif','image/avif'];
function uploadPoemImage(file,onSuccess,onError){
  var token=getToken();
  if(!token){onError(new Error('Нет токена'));return;}
  if(!_ALLOWED_IMG.includes(file.type)){onError(new Error('Разрешены только JPEG, PNG, WebP, GIF, AVIF'));return;}
  if(file.size>10*1024*1024){onError(new Error('Файл больше 10 МБ'));return;}
  var filename=sanitizeFilename(file.name,'image');
  var path='images/'+filename;
  var reader=new FileReader();
  reader.onerror=function(){onError(new Error('Ошибка чтения файла'));};
  reader.onload=function(e){
    var arr=new Uint8Array(e.target.result);
    var chunks=[];
    for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
    var b64=btoa(chunks.join(''));
    fetch(API+path+'?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
    .then(function(r){return r.json();})
    .then(function(existing){
      var body={message:'Upload image: '+filename,content:b64,branch:'main'};
      if(existing&&existing.sha&&!existing.message)body.sha=existing.sha;
      return fetch(API+path,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    })
    .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
    .then(function(){onSuccess(filename);})
    .catch(onError);
  };
  reader.readAsArrayBuffer(file);
}

function uploadTaleAudio(files){
  if(!files||!files.length)return;
  var token=getToken();
  var prog=document.getElementById('tale-mp3-progress');
  if(!token){prog.textContent='Нет токена';prog.style.display='block';return;}
  var fileArr=Array.prototype.slice.call(files);
  var total=fileArr.length;
  var firstSafe=null;
  prog.style.display='block';prog.style.color='rgba(201,169,110,0.7)';
  prog.textContent=total>1?'[1/'+total+'] Загрузка…':'Загрузка…';
  function uploadOne(idx){
    if(idx>=total){
      prog.style.color='#7bc47b';
      prog.textContent=total>1?'✓ Загружено: '+total+' файла':'✓ Загружено: '+firstSafe;
      return;
    }
    var file=fileArr[idx];
    if(file.size>25*1024*1024){prog.style.color='#d47a7a';prog.textContent='Файл '+file.name+' больше 25MB';uploadOne(idx+1);return;}
    if(total>1)prog.textContent='['+(idx+1)+'/'+total+'] '+file.name+'…';
    var reader=new FileReader();
    reader.onload=function(e){
      var arr=new Uint8Array(e.target.result);
      var chunks=[];
      for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
      var b64=btoa(chunks.join(''));
      var safeName=sanitizeFilename(file.name,'audio');
      if(idx===0)firstSafe=safeName;
      var path='audio/'+safeName;
      fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      })
      .then(function(r){return r.json();})
      .then(function(ex){
        var body={message:'Upload audio: '+safeName,content:b64,branch:'main'};
        if(ex&&ex.sha&&!ex.message)body.sha=ex.sha;
        return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
          method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
      })
      .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
      .then(function(){
        if(idx===0){
          document.getElementById('tale-mp3-input').value=firstSafe;
          document.getElementById('tale-mp3-name').textContent=firstSafe;
          document.getElementById('tale-mp3-name').style.color='#e8ddd0';
          document.getElementById('tale-mp3-clear').style.display='inline';
        }
        uploadOne(idx+1);
      })
      .catch(function(e){prog.style.color='#d47a7a';prog.textContent='Ошибка: '+e.message;uploadOne(idx+1);});
    };
    reader.readAsArrayBuffer(file);
  }
  uploadOne(0);
}

function parseCarouselEntry(raw){
  var lines=raw.split('\n');
  var img='';var isTitle=false;var textLines=[];var headerDone=false;
  lines.forEach(function(l){
    if(!headerDone){
      if(/^images\//.test(l.trim())||/^https?:\/\//.test(l.trim())){img=l.trim();return;}
      if(l.trim()==='[title]'){isTitle=true;headerDone=true;return;}
      headerDone=true;textLines.push(l);
    } else {textLines.push(l);}
  });
  while(textLines.length&&!textLines[0].trim())textLines.shift();
  return{img:img,isTitle:isTitle,text:textLines.join('\n').trim()};
}
function parseEditEntry(raw){
  var images=[];
  var lines=raw.split('\n').filter(function(l){
    var m=l.match(/^#\s*image:\s*(.+)$/);
    if(m){images.push(m[1].trim());return false;}
    return true;
  });
  var title='',url='',titleIdx=-1,urlIdx=-1;
  for(var i=0;i<lines.length;i++){if(lines[i].trim()&&titleIdx===-1){title=lines[i].trim();titleIdx=i;break;}}
  for(var i=0;i<lines.length;i++){if(/^https?:\/\//.test(lines[i].trim())){url=lines[i].trim();urlIdx=i;break;}}
  var cutAt=Math.max(titleIdx,urlIdx)+1;
  var text=lines.slice(cutAt).join('\n').trim();
  var price='';
  text=text.replace(/(?:^|\n)(?:Цена:|Price:)\s*([^\n]*)/,function(_,p){price=p.trim();return '';}).trim();
  return{title:title,url:url,text:text,price:price,images:images};
}

function uploadShopEditImage(file,_batch){
  if(!file)return;
  var token=getToken();
  var prog=document.getElementById('edit-shop-photo-prog');
  if(!token){if(prog){prog.style.display='block';prog.style.color='#d47a7a';prog.textContent='Нет токена';}return;}
  if(file.size>10*1024*1024){if(prog){prog.style.display='block';prog.style.color='#d47a7a';prog.textContent='Файл больше 10MB';}return;}
  if(prog){prog.style.display='block';prog.style.color='rgba(201,169,110,0.7)';prog.textContent='Загрузка…';}
  var targetImages=_edShopImages;
  var reader=new FileReader();
  reader.onload=function(e){
    var arr=new Uint8Array(e.target.result);
    var chunks=[];
    for(var i=0;i<arr.length;i+=8192)chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));
    var b64=btoa(chunks.join(''));
    var ext=file.name.split('.').pop().toLowerCase()||'jpg';
    var path='images/shop/'+(new Date()).getTime()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
    fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    })
    .then(function(r){return r.json();})
    .then(function(ex){
      var body={message:'Upload shop image',content:b64,branch:'main'};
      if(ex&&ex.sha&&!ex.message)body.sha=ex.sha;
      return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
        method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
    })
    .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
    .then(function(){
      if(_batch){_batch.ok=(_batch.ok||0)+1;_editUploadStatus(prog,_batch);}
      else if(prog){prog.style.color='#7bc47b';prog.textContent='✓ Загружено';}
      targetImages.push(path);
      if(targetImages===_edShopImages)_refreshEditShopPhotoList();
    })
    .catch(function(err){
      if(_batch){_batch.err=(_batch.err||0)+1;_editUploadStatus(prog,_batch,err.message);}
      else if(prog){prog.style.color='#d47a7a';prog.textContent='Ошибка: '+err.message;}
    });
  };
  reader.readAsArrayBuffer(file);
}

function writeEditFile(token,entries,message,onSuccess,onError){
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+_ed.file+'?ref=main',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.status===404?{sha:null}:r.json();})
  .then(function(d){
    var content=entries.length?entries.join('\n\n===\n\n')+'\n\n===\n':'';
    var encoded=b64e(content);
    var body={message:message,content:encoded,branch:'main'};
    if(d.sha)body.sha=d.sha;
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+_ed.file,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
  .then(function(){onSuccess();})
  .catch(onError);
}

  if(!token){el.innerHTML='<div style="color:#d47a7a;font-size:0.85rem">Сначала введите токен</div>';return;}
  el.innerHTML='<div style="opacity:0.4;font-size:0.85rem">Загрузка…</div>';
  fetch('https://api.github.com/repos/'+REPO+'/contents/audio?ref=main',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(r.status===404){el.innerHTML='<div style="opacity:0.4;font-size:0.85rem">Нет аудиофайлов</div>';return null;}
    return r.json();
  })
  .then(function(files){
    if(!files)return;
    if(!files.length){el.innerHTML='<div style="opacity:0.4;font-size:0.85rem">Нет аудиофайлов</div>';return;}
    var ts=JSON.parse(localStorage.getItem('audio_ts')||'{}');
    files.sort(function(a,b){var ta=ts[a.name]||0,tb=ts[b.name]||0;if(ta!==tb)return tb-ta;return a.name.localeCompare(b.name);});
    el.innerHTML='';
    files.forEach(function(f){
      var item=document.createElement('div');item.className='audio-item';
      var nm=document.createElement('span');nm.className='audio-item-name';nm.textContent=f.name;
      var audio=document.createElement('audio');audio.controls=true;audio.src=f.download_url;
      var del=document.createElement('button');del.className='audio-del-btn';del.textContent='✕';
      del.onclick=function(){deleteEditAudio(f.name,f.sha,del);};
      item.appendChild(nm);item.appendChild(audio);item.appendChild(del);
      el.appendChild(item);
    });
  })
  .catch(function(e){if(e.message!=='skip')el.innerHTML='<div style="color:#d47a7a;font-size:0.85rem">Ошибка: '+e.message+'</div>';});
}

function deleteEditAudio(filename,sha,btn){
  if(!confirm('Удалить '+filename+'?'))return;
  var token=getToken();if(!token)return;
  btn.disabled=true;
  fetch('https://api.github.com/repos/'+REPO+'/contents/audio/'+encodeURIComponent(filename),{
    method:'DELETE',
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'Delete audio: '+filename,sha:sha,branch:'main'})
  })
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);loadEditAudio();})
  .catch(function(e){btn.disabled=false;alert('Ошибка: '+e.message);});
}
function uploadEditAudioMulti(files){
  if(!files||!files.length)return;
  var token=getToken();
  var prog=document.getElementById('edit-audio-prog');
  if(!token){prog.textContent='Нет токена';prog.style.display='block';prog.style.color='#d47a7a';return;}
  var fileArr=Array.prototype.slice.call(files);
  var total=fileArr.length;
  prog.style.display='block';prog.style.color='rgba(201,169,110,0.7)';
  prog.textContent='[1/'+total+'] Загрузка…';
  function uploadOne(idx){
    if(idx>=total){
      prog.style.color='#7bc47b';
      prog.textContent='✓ Загружено: '+total+(total===1?' файл':total<=4?' файла':' файлов');
      document.getElementById('edit-audio-file').value='';
      loadEditAudio();return;
    }
    var file=fileArr[idx];
    if(file.size>25*1024*1024){prog.style.color='#d47a7a';prog.textContent='Файл '+file.name+' больше 25MB';uploadOne(idx+1);return;}
    prog.style.color='rgba(201,169,110,0.7)';
    prog.textContent='['+(idx+1)+'/'+total+'] '+file.name+'…';
    var reader=new FileReader();
    reader.onload=function(e){
      var arr=new Uint8Array(e.target.result);
      var chunks=[];
      for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
      var b64=btoa(chunks.join(''));
      var safeName=sanitizeFilename(file.name,'audio');
      var path='audio/'+safeName;
      fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      })
      .then(function(r){return r.json();})
      .then(function(ex){
        var body={message:'Upload audio: '+safeName,content:b64,branch:'main'};
        if(ex&&ex.sha&&!ex.message)body.sha=ex.sha;
        return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
          method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
      })
      .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
      .then(function(){uploadOne(idx+1);})
      .catch(function(e){prog.style.color='#d47a7a';prog.textContent='Ошибка: '+e.message;uploadOne(idx+1);});
    };
    reader.readAsArrayBuffer(file);
  }
  uploadOne(0);
}

function switchInbox(){
  var panel=document.getElementById('inbox-panel');
  var mainPanel=document.getElementById('main-panel');
  var tabs=document.querySelector('.tabs');
  if(panel.style.display==='block'){
    panel.style.display='none';
    if(mainPanel)mainPanel.style.display='block';
    if(tabs)tabs.style.display='';
    document.getElementById('inbox-btn').classList.remove('active');
    return;
  }
  document.getElementById('inbox-btn').classList.add('active');
  if(mainPanel)mainPanel.style.display='none';
  if(tabs)tabs.style.display='none';
  panel.style.display='block';
  localStorage.setItem('inbox_seen',Date.now());
  document.getElementById('inbox-badge').style.display='none';
  loadInbox();
}

function updateBadge(msgs){
  var badge=document.getElementById('inbox-badge');
  var seen=parseInt(localStorage.getItem('inbox_seen')||'0');
  var newCount=msgs.filter(function(i){return new Date(i.created_at).getTime()>seen;}).length;
  if(newCount>0){badge.textContent=newCount;badge.style.display='flex';}else{badge.style.display='none';}
}

function loadInbox(){
  var token=getToken();
  if(!token){document.getElementById('inbox-list').innerHTML='<div class="inbox-empty">Сначала введите токен</div>';return;}
  document.getElementById('inbox-list').innerHTML='<span style="opacity:0.4;font-size:0.85rem">Загрузка…</span>';
  fetch('https://api.github.com/repos/'+REPO+'/issues?state='+currentInboxTab+'&per_page=50&sort=created&direction=asc',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return checkR(r).json();})
  .then(function(issues){
    var msgs=issues.filter(function(i){return i.title.startsWith('💌');});
    var inboxOpen=document.getElementById('inbox-panel').style.display==='block';
    if(currentInboxTab==='open'){
      if(inboxOpen){document.getElementById('inbox-badge').style.display='none';}
      else{updateBadge(msgs);}
    }
    var list=document.getElementById('inbox-list');
    if(!msgs.length){list.innerHTML='<div class="inbox-empty">Нет сообщений</div>';return;}
    list.innerHTML='';
    msgs.forEach(function(issue){
      var m=issue.title.match(/^💌\s*(.*?)\s*\(([^)]*)\)\s*$/);
      var name=m?m[1]:issue.title.replace(/^💌\s*/,'');
      var date=new Date(issue.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      // Parse contact lines from body (new format) or fall back to email in title (old format)
      var bodyRaw=issue.body||'';
      var bodyLines=bodyRaw.split('\n');
      var contacts={email:m?m[2]:'',telegram:''};
      var msgStart=0;
      for(var li=0;li<bodyLines.length;li++){
        var bl=bodyLines[li];
        if(bl.startsWith('Email: ')){contacts.email=bl.slice(7).trim();msgStart=li+1;}
        else if(bl.startsWith('Telegram: ')){contacts.telegram=bl.slice(10).trim();msgStart=li+1;}
        else if(bl.startsWith('Instagram: ')){msgStart=li+1;}
        else if(bl.trim()===''&&msgStart===li){msgStart=li+1;}
        else if(msgStart>0){break;}
      }
      var msgText=bodyLines.slice(msgStart).join('\n').trim()||bodyRaw.trim();
      var contactsHtml='';
      if(contacts.email||contacts.telegram){
        contactsHtml='<div class="inbox-contacts">';
        if(contacts.email)contactsHtml+='<a href="mailto:'+esc(contacts.email)+'" class="inbox-contact-link">📧 '+esc(contacts.email)+'</a>';
        if(contacts.telegram){var tg=contacts.telegram.replace(/^@/,'');contactsHtml+='<a href="https://t.me/'+esc(tg)+'" target="_blank" rel="noopener noreferrer" class="inbox-contact-link">✈️ '+esc(contacts.telegram)+'</a>';}
        contactsHtml+='</div>';
      }
      var div=document.createElement('div');
      div.className='inbox-msg';
      div.dataset.issue=issue.number;
      var repliesHtml='';
      if(issue.comments>0){
        repliesHtml='<div class="inbox-replies" id="replies-'+issue.number+'"><span style="opacity:0.4;font-size:0.78rem">Загрузка ответов…</span></div>';
      }
      div.innerHTML=
        '<div class="inbox-msg-meta"><span class="inbox-msg-name">'+esc(name)+'</span><span class="inbox-msg-date">'+date+'</span></div>'+
        contactsHtml+
        '<div class="inbox-msg-text">'+esc(msgText)+'</div>'+
        repliesHtml+
        (contacts.email||contacts.telegram?'<button class="inbox-reply-btn" data-email="'+esc(contacts.email)+'" data-tg="'+esc(contacts.telegram)+'" onclick="showReplyMenu(this)">Ответить ↩</button>':'')+
        '<button class="inbox-del-btn" onclick="deleteMessage('+issue.number+',this)">✕ Удалить</button>'+
        (currentInboxTab==='open'?'<button class="inbox-close-btn" onclick="closeMessage('+issue.number+')">✓ Архив</button>':'');
      list.appendChild(div);
      if(issue.comments>0) loadReplies(issue.number);
    });
  })
  .catch(function(e){showListError(document.getElementById('inbox-list'),'Ошибка: '+e.message);});
}

function loadReplies(number){
  var token=getToken();
  fetch('https://api.github.com/repos/'+REPO+'/issues/'+number+'/comments',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.json();})
  .then(function(comments){
    var el=document.getElementById('replies-'+number);
    if(!el)return;
    el.innerHTML='';
    comments.forEach(function(c){
      var d=new Date(c.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      var item=document.createElement('div');
      item.className='inbox-reply-item';
      item.innerHTML='<div class="inbox-reply-item-date">'+d+'</div><div class="inbox-reply-item-text">'+esc(c.body)+'</div>';
      el.appendChild(item);
    });
  }).catch(function(){});
}

function showReplyMenu(btn){
  var existing=document.querySelector('.inbox-reply-menu');
  if(existing){existing.remove();if(existing._anchor===btn)return;}
  var email=btn.dataset.email||'';
  var tg=btn.dataset.tg||'';
  var menu=document.createElement('div');
  menu.className='inbox-reply-menu';menu._anchor=btn;
  var html='<div style="padding:6px 14px 5px;font-size:0.67rem;color:rgba(201,169,110,0.45);border-bottom:1px solid rgba(201,169,110,0.12)">Отвечай с poet@iabard.com</div>';
  if(email)html+='<a href="mailto:'+esc(email)+'?from=poet%40iabard.com">📧 Email — '+esc(email)+'</a>';
  if(tg){var tgHandle=tg.replace(/^@/,'');html+='<a href="https://t.me/'+esc(tgHandle)+'" target="_blank" rel="noopener noreferrer">✈️ Telegram — '+esc(tg)+'</a>';}
  if(!html)return;
  menu.innerHTML=html;
  btn.insertAdjacentElement('afterend',menu);
  setTimeout(function(){
    document.addEventListener('click',function h(e){if(!menu.contains(e.target)&&e.target!==btn){menu.remove();document.removeEventListener('click',h);}});
  },0);
}

function closeMessage(number){
  var token=getToken();
  var btn=document.querySelector('[data-issue="'+number+'"] .inbox-close-btn');
  if(btn){btn.disabled=true;btn.textContent='…';}
  fetch('https://api.github.com/repos/'+REPO+'/issues/'+number,{
    method:'PATCH',
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({state:'closed'})
  })
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(){
    var msg=document.querySelector('[data-issue="'+number+'"]');
    if(msg){msg.style.transition='opacity 0.4s';msg.style.opacity='0';setTimeout(function(){
      msg.remove();
      var remaining=document.querySelectorAll('#inbox-list .inbox-msg');
      if(!remaining.length){document.getElementById('inbox-list').innerHTML='<div class="inbox-empty">Нет сообщений</div>';}
    },400);}
    document.getElementById('inbox-badge').style.display='none';
  })
  .catch(function(e){
    if(e.message==='skip')return;
    if(btn){btn.disabled=false;btn.textContent='✓ Архив';}
    alert('Ошибка архивирования: '+e.message);
  });
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderPoemCards(parts){
  poemParts=parts.slice();
  var cards=document.getElementById('poem-cards');
  cards.innerHTML='';
  var count=document.getElementById('poem-search-count');
  if(count)count.textContent=parts.length+' стихов';
  parts.forEach(function(poem,idx){
    var title=poem.split('\n')[0].trim()||'(без названия)';
    var card=document.createElement('div');
    card.className='pcard';
    card.dataset.idx=String(idx);
    card.innerHTML=
      '<div class="pcard-head" onclick="togglePoemCard(this)">'+
        '<span class="pcard-title">'+esc(title)+'</span>'+
        '<span class="pcard-arrow">▼</span>'+
      '</div>'+
      '<div class="pcard-body">'+
        '<textarea class="pcard-ta" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off">'+esc(poem)+'</textarea>'+
        '<div class="pcard-bar">'+
          '<span class="pcard-status"></span>'+
          '<div style="display:flex;gap:8px">'+
            '<button class="pcard-del" onclick="deletePoemCard(this)">Удалить</button>'+
            '<button class="pcard-save" onclick="savePoemCard(this)">Сохранить</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    cards.appendChild(card);
  });
  filterPoemCards(document.getElementById('poem-search').value||'');
}

function togglePoemCard(head){
  var body=head.nextElementSibling;
  var arrow=head.querySelector('.pcard-arrow');
  var open=body.style.display==='block';
  if(open){
    body.style.display='none';
    arrow.classList.remove('open');
  } else {
    body.style.display='block';
    arrow.classList.add('open');
    var ta=body.querySelector('.pcard-ta');
    ta.style.height='auto';
    ta.style.height=Math.max(160,ta.scrollHeight)+'px';
  }
}

function filterPoemCards(q){
  var term=q.trim().toLowerCase();
  var cards=document.querySelectorAll('#poem-cards .pcard');
  var visible=0;
  cards.forEach(function(c){
    var title=c.querySelector('.pcard-title').textContent.toLowerCase();
    var match=!term||title.indexOf(term)!==-1;
    c.style.display=match?'':'none';
    if(match)visible++;
  });
  var count=document.getElementById('poem-search-count');
  if(count)count.textContent=term?(visible+' / '+poemParts.length):poemParts.length+' стихов';
}

var _writeBusy=false;
function _writePoemsFile(token,cardStatusEl,saveBtn,delBtn,onSuccess,onError,_isRetry){
  if(_writeBusy){
    if(cardStatusEl){cardStatusEl.textContent='Подождите…';cardStatusEl.style.color='rgba(201,169,110,0.8)';}
    if(saveBtn)saveBtn.disabled=false;
    if(delBtn)delBtn.disabled=false;
    return;
  }
  _writeBusy=true;
  if(cardStatusEl){cardStatusEl.textContent='Сохранение…';cardStatusEl.style.color='rgba(201,169,110,0.8)';}
  fetch(API+'poems.txt?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(data){
    var sha=data.sha;
    var toSave=poemParts.slice().reverse();
    var content=toSave.length?toSave.join('\n\n===\n\n')+'\n\n===\n':'';
    var encoded=b64e(content);
    return fetch(API+'poems.txt',{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Update poem via admin panel',content:encoded,sha:sha,branch:'main'})
    });
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
    return r.json();
  })
  .then(function(){
    _writeBusy=false;
    if(saveBtn)saveBtn.disabled=false;
    if(delBtn)delBtn.disabled=false;
    if(cardStatusEl){cardStatusEl.textContent='✓ Сохранено';cardStatusEl.style.color='#7bc47b';}
    setStatus('Сохранено ✓',true);
    if(onSuccess)onSuccess();
  })
  .catch(function(e){
    _writeBusy=false;
    if(e.message==='skip')return;
    if(!_isRetry&&e.message&&e.message.indexOf('does not match')!==-1){
      if(cardStatusEl){cardStatusEl.textContent='Конфликт, повтор…';cardStatusEl.style.color='rgba(201,169,110,0.8)';}
      else setStatus('SHA конфликт — повтор…');
      _writePoemsFile(token,cardStatusEl,saveBtn,delBtn,onSuccess,onError,true);
      return;
    }
    if(saveBtn)saveBtn.disabled=false;
    if(delBtn)delBtn.disabled=false;
    var errMsg='Ошибка: '+e.message;
    if(cardStatusEl){cardStatusEl.textContent=errMsg;cardStatusEl.style.color='rgba(200,100,100,0.8)';}
    else setStatus(errMsg);
    if(onError)onError(e);
  });
}

function savePoemCard(btn){
  var token=getToken();
  if(!token){alert('Сначала введите токен');return;}
  var card=btn.closest('.pcard');
  var idx=parseInt(card.dataset.idx);
  var ta=card.querySelector('.pcard-ta');
  var statusEl=card.querySelector('.pcard-status');
  var delBtn=card.querySelector('.pcard-del');
  var newText=ta.value.replace(/^([^\n]+)\n\n(\()/, '$1\n$2').trimEnd();
  poemParts[idx]=newText;
  card.querySelector('.pcard-title').textContent=newText.split('\n')[0].trim()||'(без названия)';
  btn.disabled=true;
  delBtn.disabled=true;
  _writePoemsFile(token,statusEl,btn,delBtn,null);
}

function deletePoemCard(btn){
  if(!confirm('Удалить это стихотворение?'))return;
  var token=getToken();
  if(!token){alert('Сначала введите токен');return;}
  var card=btn.closest('.pcard');
  var idx=parseInt(card.dataset.idx);
  var saveBtn=card.querySelector('.pcard-save');
  btn.disabled=true;saveBtn.disabled=true;
  var removed=poemParts.splice(idx,1)[0];
  setStatus('Удаление…');
  _writePoemsFile(token,null,null,null,function(){
    setStatus('Удалено ✓',true);
    renderPoemCards(poemParts);
  },function(){
    poemParts.splice(idx,0,removed);
    btn.disabled=false;
    saveBtn.disabled=false;
  });
}
