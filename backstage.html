<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Редактор — Ипатия Бард</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Georgia',serif;background:#0e0a0e;color:#e8ddd0;min-height:100vh;padding:24px 16px}
  h1{font-size:1.4rem;color:#c9a96e;letter-spacing:2px;text-align:center;margin-bottom:24px;font-weight:400}
  .token-section{max-width:600px;margin:0 auto 28px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.2);border-radius:10px;padding:20px}
  .token-section label{display:block;font-size:0.8rem;color:rgba(201,169,110,0.8);letter-spacing:1px;margin-bottom:8px}
  .token-row{display:flex;gap:10px}
  input[type=password],input[type=text]{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 14px;color:#e8ddd0;font-size:0.95rem;outline:none}
  input:focus{border-color:rgba(201,169,110,0.6)}
  button{background:rgba(201,169,110,0.15);border:1px solid rgba(201,169,110,0.4);border-radius:6px;color:#c9a96e;padding:10px 18px;cursor:pointer;font-size:0.9rem;transition:all 0.2s;white-space:nowrap}
  button:hover{background:rgba(201,169,110,0.28);border-color:#c9a96e}
  .tabs{max-width:600px;margin:0 auto 0;display:flex;gap:0}
  .tab-btn{flex:1;padding:12px;text-align:center;cursor:pointer;border:1px solid rgba(201,169,110,0.2);border-bottom:none;border-radius:8px 8px 0 0;background:rgba(255,255,255,0.03);color:rgba(201,169,110,0.6);font-size:0.85rem;letter-spacing:1px;transition:all 0.2s}
  .tab-btn.active{background:rgba(201,169,110,0.1);color:#c9a96e;border-color:rgba(201,169,110,0.4)}
  .editor-wrap{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;overflow:hidden}
  textarea{width:100%;height:65vh;background:#0a060a;color:#e8ddd0;border:none;padding:20px;font-family:'Georgia',serif;font-size:0.95rem;line-height:1.7;resize:none;outline:none;-webkit-user-select:text;user-select:text}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(201,169,110,0.07);border-top:1px solid rgba(201,169,110,0.15)}
  .status{font-size:0.8rem;color:rgba(201,169,110,0.7);min-height:1.2em}
  .save-btn{background:#c9a96e;border:none;border-radius:6px;color:#0e0a0e;padding:10px 28px;cursor:pointer;font-size:0.95rem;font-weight:600;transition:opacity 0.2s}
  .save-btn:hover{opacity:0.85}
  .save-btn:disabled{opacity:0.4;cursor:not-allowed}
  .novinka-panel{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;padding:24px 20px;display:none}
  .novinka-url-row{display:flex;gap:10px;margin-bottom:16px}
  .novinka-url-row input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 14px;color:#e8ddd0;font-size:0.95rem;outline:none}
  .novinka-url-row input:focus{border-color:rgba(201,169,110,0.6)}
.novinka-queue-label{font-size:0.72rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(201,169,110,0.5);margin-bottom:6px}
  .novinka-status{font-size:0.82rem;color:rgba(201,169,110,0.8);min-height:1.2em;margin-top:12px}
  .novinka-add-btn{background:#c9a96e;border:none;border-radius:6px;color:#0e0a0e;padding:10px 28px;cursor:pointer;font-size:0.95rem;font-weight:600;transition:opacity 0.2s;width:100%}
  .novinka-add-btn:hover{opacity:0.85}
  .novinka-add-btn:disabled{opacity:0.4;cursor:not-allowed}
  .hint{max-width:600px;margin:16px auto 0;font-size:0.78rem;color:rgba(201,169,110,0.45);line-height:1.6;text-align:center}
  .token-ok{color:#7bc47b;font-size:0.8rem;margin-top:8px}
  .audio-panel{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:0 0 10px 10px;padding:24px 20px;display:none}
  .audio-upload-box{border:2px dashed rgba(201,169,110,0.3);border-radius:8px;padding:32px 20px;text-align:center;margin-bottom:24px;transition:border-color 0.2s}
  .audio-upload-box.drag{border-color:#c9a96e}
  .audio-upload-box input[type=file]{display:none}
  .audio-upload-box label{cursor:pointer;display:block}
  .audio-upload-icon{font-size:2.4rem;margin-bottom:10px}
  .audio-upload-text{font-size:0.9rem;color:rgba(201,169,110,0.7);margin-bottom:14px}
  .audio-progress{margin-top:14px;font-size:0.82rem;color:rgba(201,169,110,0.8);min-height:1.2em}
  .audio-list{display:flex;flex-direction:column;gap:10px}
  .audio-list-title{font-size:0.78rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(201,169,110,0.5);margin-bottom:4px}
  .audio-item{display:flex;flex-wrap:wrap;gap:8px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.15);border-radius:7px;padding:10px 14px}
  .audio-item-name{width:100%;font-size:0.85rem;word-break:break-word;color:rgba(232,221,208,0.9)}
  .audio-item audio{flex:1;min-width:0;height:32px}
  .audio-copy-btn{background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.3);border-radius:5px;color:#c9a96e;padding:5px 10px;cursor:pointer;font-size:0.75rem;white-space:nowrap;flex-shrink:0}
  .audio-del-btn{background:rgba(180,60,60,0.12);border:1px solid rgba(180,60,60,0.3);border-radius:5px;color:#d47a7a;padding:5px 9px;cursor:pointer;font-size:0.75rem;flex-shrink:0}
  .back-btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;background:transparent;border:1px solid rgba(201,169,110,0.3);border-radius:8px;color:rgba(201,169,110,0.7);font-size:0.82rem;letter-spacing:1px;cursor:pointer;text-decoration:none;transition:all 0.2s;width:72px}
  .back-btn:hover{border-color:#c9a96e;color:#c9a96e}
  .top-bar{max-width:600px;margin:0 auto 16px;display:flex;align-items:center}
  .top-bar h1{flex:1;text-align:center;margin:0}
  .inbox-btn{background:transparent;border:1px solid rgba(201,169,110,0.3);border-radius:8px;color:rgba(201,169,110,0.6);padding:0;width:72px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0;position:relative}
  .inbox-btn:hover{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,0.08)}
  .inbox-btn.active{border-color:#c9a96e;color:#c9a96e;background:rgba(201,169,110,0.12)}
  .inbox-badge{position:absolute;top:-6px;right:-6px;background:#c9a96e;color:#0e0a0e;border-radius:9px;min-width:18px;height:18px;padding:0 4px;font-size:0.68rem;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
  .token-section{max-width:600px;margin:0 auto 20px;background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.2);border-radius:10px;overflow:hidden}
  .token-toggle{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
  .token-toggle-label{font-size:0.78rem;color:rgba(201,169,110,0.7);letter-spacing:1px;flex:1}
  .token-toggle-status{font-size:0.78rem;color:#7bc47b}
  .token-arrow{font-size:0.65rem;color:rgba(201,169,110,0.4);transition:transform 0.2s}
  .token-arrow.open{transform:rotate(180deg)}
  .token-body{padding:0 16px 16px;display:none}
  .token-row{display:flex;gap:10px}
  .inbox-panel{max-width:600px;margin:0 auto;border:1px solid rgba(201,169,110,0.3);border-radius:10px;padding:24px 20px;display:none}
  .inbox-msg{background:rgba(201,169,110,0.06);border:1px solid rgba(201,169,110,0.15);border-radius:8px;padding:16px 18px;margin-bottom:12px;transition:opacity 0.4s}
  .inbox-msg-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
  .inbox-msg-name{font-size:0.9rem;color:#c9a96e;font-weight:600}
  .inbox-msg-date{font-size:0.73rem;color:rgba(201,169,110,0.5);white-space:nowrap}
  .inbox-msg-email{font-size:0.78rem;color:rgba(201,169,110,0.55);margin-bottom:10px}
  .inbox-contacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .inbox-contact-link{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;
    background:rgba(201,169,110,0.10);border:1px solid rgba(201,169,110,0.25);
    color:rgba(201,169,110,0.75);font-size:0.72rem;text-decoration:none;transition:all 0.2s}
  .inbox-contact-link:hover{background:rgba(201,169,110,0.20);border-color:#c9a96e;color:#c9a96e}
  .inbox-msg-text{font-size:0.87rem;color:rgba(232,221,208,0.85);line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .inbox-reply-btn{margin-top:12px;background:transparent;border:1px solid rgba(201,169,110,0.3);border-radius:5px;color:rgba(201,169,110,0.7);padding:5px 14px;cursor:pointer;font-size:0.75rem;transition:all 0.2s}
  .inbox-reply-btn:hover{border-color:#c9a96e;color:#c9a96e}
  .inbox-reply-menu{margin-top:6px;background:#1e1220;border:1px solid rgba(201,169,110,0.25);border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.55)}
  .inbox-reply-menu a{display:block;padding:9px 16px;color:rgba(253,246,238,0.80);text-decoration:none;font-size:0.78rem;transition:background 0.15s;white-space:nowrap}
  .inbox-reply-menu a+a{border-top:1px solid rgba(201,169,110,0.10)}
  .inbox-reply-menu a:hover{background:rgba(201,169,110,0.08);color:#c9a96e}
  .inbox-reply-box{margin-top:10px;display:none}
  .inbox-reply-box textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 12px;color:#e8ddd0;font-family:'Georgia',serif;font-size:0.85rem;line-height:1.6;resize:vertical;outline:none;min-height:80px}
  .inbox-reply-box textarea:focus{border-color:rgba(201,169,110,0.5)}
  .inbox-send-btn{margin-top:8px;background:#c9a96e;border:none;border-radius:5px;color:#0e0a0e;padding:7px 20px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:opacity 0.2s}
  .inbox-send-btn:hover{opacity:0.85}
  .inbox-send-btn:disabled{opacity:0.4;cursor:not-allowed}
  .inbox-replies{margin-top:14px;border-top:1px solid rgba(201,169,110,0.1);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .inbox-reply-item{background:rgba(201,169,110,0.04);border-left:2px solid rgba(201,169,110,0.3);padding:8px 12px;border-radius:0 6px 6px 0}
  .inbox-reply-item-date{font-size:0.7rem;color:rgba(201,169,110,0.4);margin-bottom:4px}
  .inbox-reply-item-text{font-size:0.83rem;color:rgba(232,221,208,0.8);white-space:pre-wrap;word-break:break-word}
  .inbox-empty{font-size:0.88rem;color:rgba(201,169,110,0.4);text-align:center;padding:40px 0}
  .inbox-refresh{width:100%;margin-top:18px;margin-bottom:0}
  .inbox-tabs{display:flex;margin-bottom:12px;border-bottom:1px solid rgba(201,169,110,0.2)}
  .inbox-archive-all{width:100%;margin-bottom:16px;background:transparent;border:1px solid rgba(100,180,100,0.35);border-radius:6px;color:rgba(120,200,120,0.75);padding:8px;cursor:pointer;font-size:0.78rem;letter-spacing:0.5px;transition:all 0.2s}
  .inbox-archive-all:hover{border-color:#7bc47b;color:#7bc47b}
  .inbox-tab-btn{flex:1;padding:10px;text-align:center;cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;color:rgba(201,169,110,0.5);font-size:0.85rem;letter-spacing:1px;transition:all 0.2s;margin-bottom:-1px;font-family:'Georgia',serif}
  .inbox-tab-btn.active{color:#c9a96e;border-bottom-color:#c9a96e}
  .inbox-tab-btn:hover{color:rgba(201,169,110,0.8)}
  #poem-yt-url::placeholder,#novinka-url::placeholder,#poem-add-text::placeholder,#novinka-poem::placeholder,#poem-mp3-input::placeholder{color:rgba(232,221,208,0.5)}
  .inbox-close-btn{float:right;background:transparent;border:1px solid rgba(100,180,100,0.3);border-radius:5px;color:rgba(120,200,120,0.65);padding:5px 12px;cursor:pointer;font-size:0.72rem;transition:all 0.2s}
  .inbox-close-btn:hover{border-color:#7bc47b;color:#7bc47b}
  .inbox-del-btn{float:right;margin-right:8px;background:transparent;border:1px solid rgba(180,60,60,0.3);border-radius:5px;color:rgba(200,100,100,0.65);padding:5px 12px;cursor:pointer;font-size:0.72rem;transition:all 0.2s}
  .inbox-del-btn:hover{border-color:#d47a7a;color:#d47a7a}
  .novinka-edit-box{margin-top:10px;display:none}
  .novinka-edit-box textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 12px;color:#e8ddd0;font-family:'Georgia',serif;font-size:0.85rem;line-height:1.6;resize:vertical;outline:none;min-height:140px}
  .novinka-edit-box textarea:focus{border-color:rgba(201,169,110,0.5)}
  .novinka-edit-save{margin-top:8px;background:#c9a96e;border:none;border-radius:5px;color:#0e0a0e;padding:7px 20px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:opacity 0.2s}
  .novinka-edit-save:hover{opacity:0.85}
  .novinka-edit-save:disabled{opacity:0.4;cursor:not-allowed}
  #back-to-top{position:fixed;bottom:80px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(92,61,85,0.88);border:1px solid rgba(201,169,110,0.45);color:#c9a96e;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
  #back-to-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
  #back-to-top:hover{background:#5c3d55;border-color:#c9a96e;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
  #back-to-top svg{width:18px;height:18px;fill:currentColor}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn">Сайт</a>
  <h1>✦ Редактор ✦</h1>
  <button class="inbox-btn" id="inbox-btn" onclick="switchInbox()" title="Входящие сообщения">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    <span class="inbox-badge" id="inbox-badge"></span>
  </button>
</div>

<div class="token-section" id="token-section">
  <div class="token-toggle" onclick="toggleToken()">
    <span class="token-toggle-label">GitHub Token</span>
    <span class="token-toggle-status" id="token-status"></span>
    <span class="token-arrow" id="token-arrow">▼</span>
  </div>
  <div class="token-body" id="token-body">
    <div class="token-row">
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx">
      <button onclick="saveToken()">Сохранить</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab-btn active" onclick="switchFile('poems.txt',this)">📖 Стихи</div>
  <div class="tab-btn" onclick="switchAudio(this)">🎵 Аудио</div>
  <div class="tab-btn" onclick="switchNovinka(this)">📹 Новинки</div>
</div>

<div class="novinka-panel" id="poem-add-panel" style="border-radius:10px 10px 0 0;border-bottom:none;margin-bottom:0">
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
    <label style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 14px;color:rgba(232,221,208,0.5);font-size:0.88rem;cursor:text;display:flex;align-items:center;gap:8px;transition:border-color 0.2s">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;opacity:0.6"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      <input type="url" id="poem-yt-url" placeholder="Добавить ссылку на YouTube"
        style="flex:1;background:transparent;border:none;outline:none;color:#e8ddd0;font-size:0.88rem;min-width:0;cursor:text"
        onfocus="this.closest('label').style.borderColor='rgba(201,169,110,0.6)'"
        onblur="this.closest('label').style.borderColor='rgba(201,169,110,0.25)'">
    </label>
    <label id="poem-mp3-label" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 14px;color:rgba(232,221,208,0.5);font-size:0.88rem;cursor:text;display:flex;align-items:center;gap:1px;transition:border-color 0.2s">
      <svg width="13" height="13" viewBox="6 3 8 18" preserveAspectRatio="none" fill="currentColor" style="flex-shrink:0;opacity:0.6"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <input type="text" id="poem-mp3-input" placeholder="Добавить MP3 файл"
        style="flex:1;background:transparent;border:none;outline:none;color:#e8ddd0;font-size:0.88rem;min-width:0;cursor:text"
        onfocus="this.closest('label').style.borderColor='rgba(201,169,110,0.6)'"
        onblur="this.closest('label').style.borderColor='rgba(201,169,110,0.25)'">
    </label>
  </div>
  <textarea id="poem-add-text" placeholder="Добавить стихотворение" style="width:100%;height:260px;background:#0a060a;color:#e8ddd0;border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:14px;font-family:'Georgia',serif;font-size:0.92rem;line-height:1.7;resize:vertical;outline:none;margin-bottom:16px" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off"></textarea>
  <button class="novinka-add-btn" id="poem-add-btn" onclick="addPoem()">Добавить стихотворение</button>
  <div class="novinka-status" id="poem-add-status"></div>
  <div style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(201,169,110,0.12);font-size:0.7rem;color:rgba(201,169,110,0.4);letter-spacing:1.5px;text-transform:uppercase;text-align:center">Редактор всех стихов ↓</div>
</div>

<div class="editor-wrap" id="editor-wrap" style="border-radius:0 0 10px 10px">
  <textarea id="editor" placeholder="Загрузка…" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off"></textarea>
  <div class="bar">
    <span class="status" id="status"></span>
    <button class="save-btn" id="save-btn" onclick="saveFile()" disabled>Сохранить</button>
  </div>
</div>

<div class="novinka-panel" id="novinka-panel">
  <label style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.25);border-radius:6px;padding:10px 14px;color:rgba(232,221,208,0.5);font-size:0.88rem;cursor:text;display:flex;align-items:center;gap:8px;transition:border-color 0.2s">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;opacity:0.6"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
    <input type="url" id="novinka-url" placeholder="Добавить ссылку на YouTube"
      style="flex:1;background:transparent;border:none;outline:none;color:#e8ddd0;font-size:0.88rem;min-width:0;cursor:text"
      onfocus="this.closest('label').style.borderColor='rgba(201,169,110,0.6)'"
      onblur="this.closest('label').style.borderColor='rgba(201,169,110,0.25)'">

  <button class="novinka-add-btn" id="novinka-add-btn" onclick="addNovinka()">Добавить в Новинки</button>

    <input type="file" id="audio-file-input" accept=".mp3,.m4a,.wav,.ogg,.aac,.flac,audio/*" style="display:none" onchange="uploadAudio(this.files[0])">
    <button onclick="document.getElementById('audio-file-input').click()">Выбрать файл</button>

    <button class="inbox-tab-btn" id="inbox-tab-closed" onclick="switchInboxTab('closed')">Архив</button>
  </div>

  <button class="inbox-refresh" onclick="loadInbox()">↻ Обновить сообщения</button>
</div>

<script>
const REPO = 'rongfafud-dotcom/iabard-';
const API  = 'https://api.github.com/repos/' + REPO + '/contents/';
function b64d(s){return new TextDecoder().decode(Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}));}
function b64e(s){return btoa(Array.from(new TextEncoder().encode(s),function(b){return String.fromCharCode(b);}).join(''));}

var currentFile = 'poems.txt';
var currentSha  = '';
var currentPoemCount = 0;
var currentInboxTab = 'open';

function switchInboxTab(tab){
  currentInboxTab=tab;
  document.getElementById('inbox-tab-open').classList.toggle('active',tab==='open');
  document.getElementById('inbox-tab-closed').classList.toggle('active',tab==='closed');
  document.getElementById('inbox-archive-all-btn').style.display=tab==='open'?'block':'none';
  loadInbox();
}

function archiveAll(){
  var token=getToken();
  if(!token){alert('Сначала введите токен');return;}
  var msgs=document.querySelectorAll('#inbox-list .inbox-msg');
  if(!msgs.length)return;
  if(!confirm('Архивировать все сообщения ('+msgs.length+')?'))return;
  var btn=document.getElementById('inbox-archive-all-btn');
  btn.disabled=true;btn.textContent='Архивирование…';
  var nums=Array.from(msgs).map(function(m){return m.dataset.issue;}).filter(Boolean);
  Promise.all(nums.map(function(num){
    return fetch('https://api.github.com/repos/'+REPO+'/issues/'+num,{
      method:'PATCH',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({state:'closed'})
    }).then(function(r){
      if(r.status===401){invalidToken();throw new Error('Неверный токен');}
      if(!r.ok)throw new Error('HTTP '+r.status+' для #'+num);
      return r;
    });
  })).then(function(){
    btn.disabled=false;btn.textContent='✓ Архивировать все сообщения';
    loadInbox();
  }).catch(function(e){
    btn.disabled=false;btn.textContent='✓ Архивировать все сообщения';
    alert('Ошибка: '+e.message);
  });
}

function getToken(){
  return localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token') || document.getElementById('token').value.trim();
}

function toggleToken(){
  var body=document.getElementById('token-body');
  var arrow=document.getElementById('token-arrow');
  var open=body.style.display==='block';
  body.style.display=open?'none':'block';
  arrow.classList.toggle('open',!open);
}

function saveToken(){
  var t = document.getElementById('token').value.trim();
  if(!t){setStatus('Введите токен');return;}
  localStorage.setItem('gh_token', t);
  document.getElementById('token-status').textContent = '✓';
  document.getElementById('token-body').style.display='none';
  document.getElementById('token-arrow').classList.remove('open');
  loadFile();
}

function invalidToken(){
  localStorage.removeItem('gh_token');
  document.getElementById('token').value = '';
  document.getElementById('token-status').textContent = '';
  document.getElementById('token-body').style.display='block';
  document.getElementById('token-arrow').classList.add('open');
  setStatus('Токен недействителен — введите новый');
}

function checkR(r){
  if(r.status===401){invalidToken();throw new Error('skip');}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r;
}

function setStatus(msg, ok){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = ok ? '#7bc47b' : 'rgba(201,169,110,0.7)';
}

function switchFile(file, btn){
  currentFile = file;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('inbox-btn').classList.remove('active');
  document.getElementById('poem-add-panel').style.display = file==='poems.txt'?'block':'none';
  document.getElementById('editor-wrap').style.display = '';
  document.getElementById('editor-wrap').style.borderRadius = file==='poems.txt'?'0 0 10px 10px':'10px';
  document.getElementById('audio-panel').style.display = 'none';
  document.getElementById('novinka-panel').style.display = 'none';
  document.getElementById('inbox-panel').style.display = 'none';
  document.getElementById('editor').value = '';
  document.getElementById('save-btn').disabled = true;
  currentSha = '';
  loadFile();
}

function switchNovinka(btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('inbox-btn').classList.remove('active');
  document.getElementById('poem-add-panel').style.display='none';
  document.getElementById('editor-wrap').style.display='none';
  document.getElementById('audio-panel').style.display='none';
  document.getElementById('novinka-panel').style.display='block';
  document.getElementById('inbox-panel').style.display='none';
  loadNovinkaList();
}

function extractVideoId(url){
  var m;
  m=url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/);if(m)return m[1];
  m=url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);if(m)return m[1];
  m=url.match(/[?&]v=([A-Za-z0-9_-]{11})/);if(m)return m[1];
  return null;
}

function buildNovinkaCard(poem,vid){
  var stanzas=poem.trim().split(/\n\n+/).map(function(s){return s.trim();}).filter(Boolean);
  var title=stanzas[0]||'';
  var body=stanzas.slice(1);
  var tm=title.match(/^(.*?)\s*(\(.*\))\s*$/);
  var titleHtml=title?(tm
    ?'\n        <div class="novinka-title">'+esc(tm[1])+'<br><span style="font-size:0.55em;font-weight:400;opacity:0.65;letter-spacing:1px;font-style:italic">'+esc(tm[2])+'</span></div>'
    :'\n        <div class="novinka-title">'+esc(title)+'</div>')
    :'';
  var poemHtml='';
  if(body.length){
    poemHtml='\n        <div class="novinka-poem">';
    body.forEach(function(s){
      poemHtml+='\n        <div class="stanza">'+s.split('\n').map(function(l){return esc(l.trim());}).join('<br>\n')+'\n        </div>';
    });
    poemHtml+='\n        </div>';
  }
  return '      <div class="novinka-card">'+titleHtml+'\n        <div class="novinka-video">\n          <div class="yt-facade" data-vid="'+vid+'" onclick="ytPlay(this)">\n            <img src="https://img.youtube.com/vi/'+vid+'/hqdefault.jpg" alt="Ипатия Бард" loading="lazy">\n            <button class="yt-play" aria-label="Смотреть видео">&#9654;</button>\n          </div>\n        </div>'+poemHtml+'\n      </div>';
}

function setNovinkaStatus(msg,ok){
  var el=document.getElementById('novinka-status');
  el.textContent=msg;
  el.style.color=ok?'#7bc47b':'rgba(201,169,110,0.8)';
}

function addNovinka(){
  var token=getToken();
  if(!token){setNovinkaStatus('Сначала введите токен');return;}
  var url=document.getElementById('novinka-url').value.trim();
  var vid=extractVideoId(url);
  if(!vid){setNovinkaStatus('Не удалось распознать ID видео из ссылки');return;}
  var poem=document.getElementById('novinka-poem').value.trim();
  if(!poem){setNovinkaStatus('Введи стихотворение');return;}
  var btn=document.getElementById('novinka-add-btn');
  btn.disabled=true;
  setNovinkaStatus('Загрузка index.html…');
  fetch(API+'index.html?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){return checkR(r).json();})
  .then(function(data){
    var htmlSha=data.sha;
    var html=b64d(data.content.replace(/\n/g,''));
    var START='<!-- YT-NOVINKA-START -->';
    var LIST='<div class="novinka-list">';
    var si=html.indexOf(START);
    if(si===-1)throw new Error('Маркер YT-NOVINKA-START не найден');
    var li=html.indexOf(LIST,si);
    if(li===-1)throw new Error('novinka-list не найден');
    var insertAt=li+LIST.length;
    html=html.slice(0,insertAt)+'\n'+buildNovinkaCard(poem,vid)+html.slice(insertAt);
    // Auto-rotation: keep exactly 20 cards, first 5 visible, rest hidden
    (function(){
      var novS=html.indexOf('<!-- YT-NOVINKA-START -->');
      var novE=html.indexOf('<!-- YT-NOVINKA-END -->');
      if(novS===-1||novE===-1)return;
      var VP='<div class="novinka-card">';
      var HP='<div class="novinka-card novinka-hidden">';
      var sec,sf,i,k;
      // Step 1: collect positions of all visible cards beyond the 5th (process last→first)
      sec=html.slice(novS,novE);sf=0;var toHide=[],vc=0;
      while(true){var vp=sec.indexOf(VP,sf);if(vp===-1)break;vc++;if(vc>5)toHide.push(novS+vp);sf=vp+1;}
      for(k=toHide.length-1;k>=0;k--){var ap=toHide[k];html=html.slice(0,ap)+HP+html.slice(ap+VP.length);}
      // Step 2: collect all card positions after changes, remove any beyond 20 (last→first)
      novE=html.indexOf('<!-- YT-NOVINKA-END -->');sec=html.slice(novS,novE);sf=0;var all=[];
      while(true){
        var c1=sec.indexOf(VP,sf),c2=sec.indexOf(HP,sf);
        var cp=(c1!==-1&&(c2===-1||c1<c2))?c1:c2;
        if(cp===-1)break;all.push(novS+cp);sf=cp+1;
      }
      for(k=all.length-1;k>=20;k--){
        var ls=all[k],depth=0,le=-1;
        for(i=ls;i<html.length;){
          if(html.slice(i,i+4)==='<div'){depth++;i+=4;}
          else if(html.slice(i,i+6)==='</div>'){depth--;if(depth===0){le=i+6;break;}i+=6;}
          else i++;
        }
        if(le!==-1){var rs=ls;while(rs>0&&html[rs-1]!=='\n')rs--;html=html.slice(0,rs)+html.slice(le);}
      }
    })();
    setNovinkaStatus('Сохранение…');
    var encoded=b64e(html);
    return fetch(API+'index.html',{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Add novinka: '+vid,content:encoded,sha:htmlSha,branch:'main'})
    });
  })
  .then(function(r){if(r.status===401){invalidToken();throw new Error('skip');}if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
  .then(function(){
    setNovinkaStatus('✓ Видео добавлено в Новинки!',true);
    document.getElementById('novinka-url').value='';
    document.getElementById('novinka-poem').value='';
    btn.disabled=false;
    loadNovinkaList();
  })
  .catch(function(e){
    btn.disabled=false;
    setNovinkaStatus('Ошибка: '+e.message);
  });
}

function switchAudio(btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('inbox-btn').classList.remove('active');
  document.getElementById('poem-add-panel').style.display='none';
  document.getElementById('editor-wrap').style.display = 'none';
  document.getElementById('novinka-panel').style.display = 'none';
  document.getElementById('audio-panel').style.display = 'block';
  document.getElementById('inbox-panel').style.display = 'none';
  loadAudioList();
}

function loadAudioList(){
  var token = getToken();
  if(!token){document.getElementById('audio-list').innerHTML='<span style="color:#d47a7a;font-size:0.85rem">Сначала введите токен</span>';return;}
  document.getElementById('audio-list').innerHTML='<span style="opacity:0.4;font-size:0.85rem">Загрузка…</span>';
  fetch('https://api.github.com/repos/'+REPO+'/contents/audio?ref=main',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(r.status===404)return[];
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(files){
    var list=document.getElementById('audio-list');
    if(!files.length){list.innerHTML='<span style="opacity:0.4;font-size:0.85rem">Нет загруженных треков</span>';return;}
    list.innerHTML='';
    files.forEach(function(f){
      var item=document.createElement('div');
      item.className='audio-item';
      item.innerHTML=
        '<span class="audio-item-name">'+f.name+'</span>'+
        '<audio controls src="'+f.download_url+'"></audio>'+
        '<button class="audio-copy-btn" onclick="copyAudioTag(\''+f.name+'\')">Копировать тег</button>'+
        '<button class="audio-del-btn" onclick="deleteAudio(\''+f.name+'\',\''+f.sha+'\')">✕</button>';
      list.appendChild(item);
    });
  })
  .catch(function(e){
    document.getElementById('audio-list').innerHTML='<span style="color:#d47a7a;font-size:0.85rem">Ошибка: '+e.message+'</span>';
  });
}

function copyAudioTag(filename){
  navigator.clipboard.writeText('# audio: '+filename).then(function(){
    setAudioProgress('Скопировано: # audio: '+filename);
  }).catch(function(){setAudioProgress('Ошибка копирования');});
}

function setAudioProgress(msg,ok){
  var el=document.getElementById('audio-progress');
  el.textContent=msg;
  el.style.color=ok?'#7bc47b':'rgba(201,169,110,0.8)';
}

function uploadAudio(file){
  if(!file)return;
  var token=getToken();
  if(!token){setAudioProgress('Сначала введите токен');return;}
  if(file.size>25*1024*1024){setAudioProgress('Файл больше 25MB — GitHub не принимает такие файлы. Сожми MP3.');return;}
  var mb=Math.round(file.size/1024/1024*10)/10;
  setAudioProgress('Чтение файла ('+mb+' MB)…');
  var reader=new FileReader();
  reader.onerror=function(){setAudioProgress('Ошибка чтения файла');};
  reader.onload=function(e){
    var arr=new Uint8Array(e.target.result);
    var chunks=[];
    for(var i=0;i<arr.length;i+=8192){chunks.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));}
    var b64=btoa(chunks.join(''));
    setAudioProgress('Отправка на GitHub…');
    var path='audio/'+file.name;
    fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main',{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    })
    .then(function(r){return r.json();})
    .then(function(existing){
      var body={message:'Upload audio: '+file.name,content:b64,branch:'main'};
      if(existing&&existing.sha&&!existing.message)body.sha=existing.sha;
      return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
        method:'PUT',
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
    })
    .then(function(r){
      if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
      return r.json();
    })
    .then(function(){
      setAudioProgress('✓ Загружено: '+file.name, true);
      document.getElementById('audio-file-input').value='';
      loadAudioList();
    })
    .catch(function(e){setAudioProgress('Ошибка: '+e.message);});
  };
  reader.readAsArrayBuffer(file);
}

function deleteAudio(filename,sha){
  if(!confirm('Удалить '+filename+'?'))return;
  var token=getToken();
  if(!token){setAudioProgress('Сначала введите токен');return;}
  fetch('https://api.github.com/repos/'+REPO+'/contents/audio/'+filename,{
    method:'DELETE',
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'Delete audio: '+filename,sha:sha,branch:'main'})
  })
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    setAudioProgress('Удалено: '+filename);
    loadAudioList();
  })
  .catch(function(e){setAudioProgress('Ошибка удаления: '+e.message);});
}

function loadFile(){
  var token = getToken();
  if(!token){setStatus('Сначала введите токен');return;}
  setStatus('Загрузка…');
  fetch(API + currentFile + '?ref=main', {
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(data){
    currentSha = data.sha;
    var text = b64d(data.content.replace(/\n/g,''));
    var parts = text.split('===').map(function(p){return p.trim();}).filter(Boolean);
    if(currentFile === 'poems.txt'){
      currentPoemCount = parts.length;
      parts.reverse();
      // Remove blank line between title and (subtitle) or #hashtag
      parts = parts.map(function(p){return p.replace(/^([^\n]+)\n\n([#(])/, '$1\n$2');});
    }
    text = parts.join('\n\n――――――――――――――――――――――――――\n\n') + '\n\n――――――――――――――――――――――――――\n';
    document.getElementById('editor').value = text;
    document.getElementById('save-btn').disabled = false;
    setStatus('Загружено ✓', true);
  })
  .catch(function(e){
    if(e.message!=='skip')setStatus('Ошибка загрузки: ' + e.message);
  });
}

function saveFile(){
  var token = getToken();
  if(!token){setStatus('Сначала введите токен');return;}
  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Сохранение…');
  var content = document.getElementById('editor').value;
  var SEP = '――――――――――――――――――――――――――';
  if(currentFile === 'poems.txt'){
    var parts = content.split(SEP).map(function(p){return p.trim();}).filter(Boolean);
    if(parts.length < currentPoemCount - 2 && btn.dataset.confirm !== '1'){
      btn.disabled = false;
      setStatus('⚠ Стихов станет ' + parts.length + ' вместо ' + currentPoemCount + '. Нажми ещё раз для подтверждения.');
      btn.dataset.confirm = '1';
      return;
    }
    btn.dataset.confirm = '';
    parts = parts.map(function(p){return p.replace(/^([^\n]+)\n\n([#(])/, '$1\n$2');});
    parts.reverse();
    content = parts.join('\n\n===\n\n') + '\n\n===\n';
  } else {
    content = content.split(SEP).map(function(p){return p.trim();}).filter(Boolean).join('\n\n===\n\n');
    if(content) content += '\n\n===\n';
  }
  var encoded = b64e(content);
  fetch(API + currentFile, {
    method:'PUT',
    headers:{
      'Authorization':'token '+token,
      'Accept':'application/vnd.github.v3+json',
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      message: 'Update ' + currentFile + ' via admin panel',
      content: encoded,
      sha: currentSha,
      branch: 'main'
    })
  })
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});
    return r.json();
  })
  .then(function(data){
    currentSha = data.content.sha;
    btn.disabled = false;
    setStatus('Сохранено ✓', true);
  })
  .catch(function(e){
    if(e.message==='skip'){btn.disabled=false;return;}
    btn.disabled = false;
    if(e.message && e.message.indexOf('does not match') !== -1){
      setStatus('SHA устарел — обновляю и повторяю…');
      fetch(API + currentFile + '?ref=main', {
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){return r.json();}).then(function(d){
        currentSha = d.sha;
        setStatus('SHA обновлён. Нажми «Сохранить» ещё раз.');
      }).catch(function(){setStatus('Не удалось обновить SHA.');});
    } else {
      setStatus('Ошибка: ' + e.message);
    }
  });
}


function setPoemAddStatus(msg,ok){

function savePoemEntry(poemText, audioFilename){
  var token=getToken();
  var ytUrl=document.getElementById('poem-yt-url').value.trim();
  var lines=poemText.split('\n');
  var title=lines[0];
  var rest=lines.slice(1).join('\n');
  var extras='';
  if(audioFilename) extras+='\n\n# audio: '+audioFilename;
  if(ytUrl) extras+='\n\n'+ytUrl;
  var finalPoem=title+'\n'+rest.trimStart().trimEnd()+extras;
  fetch(API+'poems.txt?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var sha=data.sha;
    var content=b64d(data.content.replace(/\n/g,''));
    content=content.trimEnd()+'\n\n===\n\n'+finalPoem+'\n\n===\n';
    var encoded=b64e(content);
    return fetch(API+'poems.txt',{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Add poem: '+title,content:encoded,sha:sha,branch:'main'})});
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
  .then(function(){
    document.getElementById('poem-add-btn').disabled=false;
    setPoemAddStatus('✓ Стихотворение добавлено!',true);
    document.getElementById('poem-add-text').value='';
    document.getElementById('poem-yt-url').value='';
    document.getElementById('poem-mp3-input').value='';
    if(currentFile==='poems.txt')loadFile();
  })
  .catch(function(e){document.getElementById('poem-add-btn').disabled=false;setPoemAddStatus('Ошибка: '+e.message);});
}

function addPoem(){
  var poemText=document.getElementById('poem-add-text').value.trim();
  if(!poemText){setPoemAddStatus('Введите стихотворение');return;}
  var audioName=(document.getElementById('poem-mp3-input').value.trim().replace(/^#\s*audio:\s*/i,'')||null);
  var btn=document.getElementById('poem-add-btn');
  btn.disabled=true;
  setPoemAddStatus('Сохранение…');
  savePoemEntry(poemText,audioName);
}

function loadNovinkaList(){
  var token=getToken();
  var listEl=document.getElementById('novinka-list-items');
  if(!token){listEl.innerHTML='<span style="opacity:0.4;font-size:0.85rem">Нет токена</span>';return;}
  listEl.innerHTML='<span style="opacity:0.4;font-size:0.85rem">Загрузка…</span>';
  fetch(API+'index.html?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var html=b64d(data.content.replace(/\n/g,''));
    var si=html.indexOf('<!-- YT-NOVINKA-START -->');
    if(si===-1){listEl.innerHTML='<span style="color:#d47a7a;font-size:0.85rem">Маркер не найден</span>';return;}
    var section=html.slice(si,html.indexOf('<!-- YT-NOVINKA-END -->',si));
    var cards=[];
    var pos=0;
    while(true){
      var cs1=section.indexOf('<div class="novinka-card">',pos);
      var cs2=section.indexOf('<div class="novinka-card novinka-hidden">',pos);
      var cs=(cs1===-1)?cs2:(cs2===-1)?cs1:Math.min(cs1,cs2);
      if(cs===-1)break;
      var depth=0,i=cs,ce=-1;
      while(i<section.length){
        if(section.slice(i,i+4)==='<div'){depth++;i+=4;}
        else if(section.slice(i,i+6)==='</div>'){depth--;if(depth===0){ce=i+6;break;}i+=6;}
        else{i++;}
      }
      if(ce===-1)break;
      var cardHtml=section.slice(cs,ce);
      var vidM=cardHtml.match(/data-vid="([A-Za-z0-9_-]{11})"/);
      if(vidM){
        var parser=new DOMParser();
        var doc=parser.parseFromString(cardHtml,'text/html');
        var titleEl=doc.querySelector('.novinka-title');
        var poemEl=doc.querySelector('.novinka-poem');
        var title=titleEl?titleEl.textContent.trim():vidM[1];
        var poem=poemEl?poemEl.textContent.replace(/\s*\n\s*/g,'\n').trim():'';
        var stanzaEls=poemEl?poemEl.querySelectorAll('.stanza'):[];
        var poemBody=Array.from(stanzaEls).map(function(s){return s.textContent.replace(/\s*\n\s*/g,'\n').trim();}).join('\n\n');
        var fullPoem=title+(poemBody?'\n\n'+poemBody:'');
        cards.push({vid:vidM[1],title:title,poem:poem,fullPoem:fullPoem});
      }
      pos=cs+1;
    }
    if(!cards.length){listEl.innerHTML='<span style="opacity:0.4;font-size:0.85rem">Нет добавленных новинок</span>';return;}
    listEl.innerHTML='';
    cards.forEach(function(v){
      var item=document.createElement('div');
      item.className='audio-item';
      item.style.cssText='flex-direction:column;align-items:stretch;gap:0';
      var poemHtml=v.poem?'<div style="font-size:0.78rem;color:rgba(232,221,208,0.55);line-height:1.55;white-space:pre-wrap;font-family:Georgia,serif;font-style:italic;border-top:1px solid rgba(201,169,110,0.1);margin-top:8px;padding-top:8px">'+esc(v.poem.slice(0,280))+(v.poem.length>280?'\n…':'')+'</div>':'';
      var eid='novinka-edit-'+v.vid;
      item.innerHTML=
        '<div style="display:flex;align-items:center;gap:8px">'+
          '<img src="https://img.youtube.com/vi/'+v.vid+'/mqdefault.jpg" style="width:72px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0">'+
          '<span class="audio-item-name" style="flex:1">'+esc(v.title)+'</span>'+
          '<button class="audio-copy-btn" onclick="editNovinka(\''+v.vid+'\')">✎</button>'+
          '<button class="audio-del-btn" onclick="deleteNovinka(\''+v.vid+'\')">✕</button>'+
        '</div>'+poemHtml+
        '<div class="novinka-edit-box" id="'+eid+'">'+
          '<textarea placeholder="Название\n\nСтрофа 1\n\nСтрофа 2" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off">'+esc(v.fullPoem)+'</textarea>'+
          '<button class="novinka-edit-save" onclick="saveNovinkaEdit(\''+v.vid+'\',this)">Сохранить</button>'+
        '</div>';
      listEl.appendChild(item);
    });
  })
  .catch(function(e){listEl.innerHTML='<span style="color:#d47a7a;font-size:0.85rem">Ошибка: '+e.message+'</span>';});
}

function deleteNovinka(vid){
  if(!confirm('Удалить это видео из Новинок?'))return;
  var token=getToken();
  if(!token){setNovinkaStatus('Сначала введите токен');return;}
  setNovinkaStatus('Удаление…');
  fetch(API+'index.html?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var sha=data.sha;
    var html=b64d(data.content.replace(/\n/g,''));
    var vidIdx=html.indexOf('data-vid="'+vid+'"');
    if(vidIdx===-1)throw new Error('Видео не найдено');
    var ls1=html.lastIndexOf('<div class="novinka-card">',vidIdx);
    var ls2=html.lastIndexOf('<div class="novinka-card novinka-hidden">',vidIdx);
    var cardStart=Math.max(ls1,ls2);
    if(cardStart===-1)throw new Error('Карточка не найдена');
    var depth=0,i=cardStart,cardEnd=-1;
    while(i<html.length){
      if(html.slice(i,i+4)==='<div'){depth++;i+=4;}
      else if(html.slice(i,i+6)==='</div>'){depth--;if(depth===0){cardEnd=i+6;break;}i+=6;}
      else{i++;}
    }
    if(cardEnd===-1)throw new Error('Конец карточки не найден');
    var newHtml=html.slice(0,cardStart).trimEnd()+'\n'+html.slice(cardEnd).replace(/^\s*\n/,'');
    var encoded=b64e(newHtml);
    return fetch(API+'index.html',{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Delete novinka: '+vid,content:encoded,sha:sha,branch:'main'})});
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
  .then(function(){setNovinkaStatus('✓ Удалено',true);loadNovinkaList();})
  .catch(function(e){setNovinkaStatus('Ошибка: '+e.message);});
}

  if(panel.style.display==='block'){
    panel.style.display='none';
    document.getElementById('inbox-btn').classList.remove('active');
    return;
  }
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});

function updateBadge(msgs){
  var badge=document.getElementById('inbox-badge');
  var seen=parseInt(localStorage.getItem('inbox_seen')||'0');
  var newCount=msgs.filter(function(i){return new Date(i.created_at).getTime()>seen;}).length;
  if(newCount>0){badge.textContent=newCount;badge.style.display='flex';}else{badge.style.display='none';}
}

function loadInbox(){
  var token=getToken();
  if(!token){document.getElementById('inbox-list').innerHTML='<div class="inbox-empty">Сначала введите токен</div>';return;}
  document.getElementById('inbox-list').innerHTML='<span style="opacity:0.4;font-size:0.85rem">Загрузка…</span>';
  fetch('https://api.github.com/repos/'+REPO+'/issues?state='+currentInboxTab+'&per_page=50&sort=created&direction=asc',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return checkR(r).json();})
  .then(function(issues){
    var msgs=issues.filter(function(i){return i.title.startsWith('💌');});
    var inboxOpen=document.getElementById('inbox-panel').style.display==='block';
    if(currentInboxTab==='open'){
      if(inboxOpen){document.getElementById('inbox-badge').style.display='none';}
      else{updateBadge(msgs);}
    }
    var list=document.getElementById('inbox-list');
    if(!msgs.length){list.innerHTML='<div class="inbox-empty">Нет сообщений</div>';return;}
    list.innerHTML='';
    msgs.forEach(function(issue){
      var m=issue.title.match(/^💌\s*(.*?)\s*\(([^)]*)\)\s*$/);
      var name=m?m[1]:issue.title.replace(/^💌\s*/,'');
      var date=new Date(issue.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      // Parse contact lines from body (new format) or fall back to email in title (old format)
      var bodyRaw=issue.body||'';
      var bodyLines=bodyRaw.split('\n');
      var contacts={email:m?m[2]:'',telegram:''};
      var msgStart=0;
      for(var li=0;li<bodyLines.length;li++){
        var bl=bodyLines[li];
        if(bl.startsWith('Email: ')){contacts.email=bl.slice(7).trim();msgStart=li+1;}
        else if(bl.startsWith('Telegram: ')){contacts.telegram=bl.slice(10).trim();msgStart=li+1;}
        else if(bl.startsWith('Instagram: ')){msgStart=li+1;}
        else if(bl.trim()===''&&msgStart===li){msgStart=li+1;}
        else if(msgStart>0){break;}
      }
      var msgText=bodyLines.slice(msgStart).join('\n').trim()||bodyRaw.trim();
      var contactsHtml='';
      if(contacts.email||contacts.telegram){
        contactsHtml='<div class="inbox-contacts">';
        if(contacts.email)contactsHtml+='<a href="mailto:'+esc(contacts.email)+'" class="inbox-contact-link">📧 '+esc(contacts.email)+'</a>';
        if(contacts.telegram){var tg=contacts.telegram.replace(/^@/,'');contactsHtml+='<a href="https://t.me/'+esc(tg)+'" target="_blank" rel="noopener noreferrer" class="inbox-contact-link">✈️ '+esc(contacts.telegram)+'</a>';}
        contactsHtml+='</div>';
      }
      var div=document.createElement('div');
      div.className='inbox-msg';
      div.dataset.issue=issue.number;
      var repliesHtml='';
      if(issue.comments>0){
        repliesHtml='<div class="inbox-replies" id="replies-'+issue.number+'"><span style="opacity:0.4;font-size:0.78rem">Загрузка ответов…</span></div>';
      }
      div.innerHTML=
        '<div class="inbox-msg-meta"><span class="inbox-msg-name">'+esc(name)+'</span><span class="inbox-msg-date">'+date+'</span></div>'+
        contactsHtml+
        '<div class="inbox-msg-text">'+esc(msgText)+'</div>'+
        repliesHtml+
        (contacts.email||contacts.telegram?'<button class="inbox-reply-btn" data-email="'+esc(contacts.email)+'" data-tg="'+esc(contacts.telegram)+'" onclick="showReplyMenu(this)">Ответить ↩</button>':'')+
        '<button class="inbox-del-btn" onclick="deleteMessage('+issue.number+',this)">✕ Удалить</button>'+
        (currentInboxTab==='open'?'<button class="inbox-close-btn" onclick="closeMessage('+issue.number+')">✓ Архив</button>':'');
      list.appendChild(div);
      if(issue.comments>0) loadReplies(issue.number);
    });
  })
  .catch(function(e){document.getElementById('inbox-list').innerHTML='<div class="inbox-empty" style="color:#d47a7a">Ошибка: '+e.message+'</div>';});
}

function loadReplies(number){
  var token=getToken();
  fetch('https://api.github.com/repos/'+REPO+'/issues/'+number+'/comments',{
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.json();})
  .then(function(comments){
    var el=document.getElementById('replies-'+number);
    if(!el)return;
    el.innerHTML='';
    comments.forEach(function(c){
      var d=new Date(c.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      var item=document.createElement('div');
      item.className='inbox-reply-item';
      item.innerHTML='<div class="inbox-reply-item-date">'+d+'</div><div class="inbox-reply-item-text">'+esc(c.body)+'</div>';
      el.appendChild(item);
    });
  }).catch(function(){});
}

function showReplyMenu(btn){
  var existing=document.querySelector('.inbox-reply-menu');
  if(existing){existing.remove();if(existing._anchor===btn)return;}
  var email=btn.dataset.email||'';
  var tg=btn.dataset.tg||'';
  var menu=document.createElement('div');
  menu.className='inbox-reply-menu';menu._anchor=btn;
  var html='<div style="padding:6px 14px 5px;font-size:0.67rem;color:rgba(201,169,110,0.45);border-bottom:1px solid rgba(201,169,110,0.12)">Отвечай с poet@iabard.com</div>';
  if(email)html+='<a href="mailto:'+esc(email)+'?from=poet%40iabard.com">📧 Email — '+esc(email)+'</a>';
  if(tg){var tgHandle=tg.replace(/^@/,'');html+='<a href="https://t.me/'+esc(tgHandle)+'" target="_blank" rel="noopener noreferrer">✈️ Telegram — '+esc(tg)+'</a>';}
  if(!html)return;
  menu.innerHTML=html;
  btn.insertAdjacentElement('afterend',menu);
  setTimeout(function(){
    document.addEventListener('click',function h(e){if(!menu.contains(e.target)&&e.target!==btn){menu.remove();document.removeEventListener('click',h);}});
  },0);
}

function closeMessage(number){
  var token=getToken();
  var btn=document.querySelector('[data-issue="'+number+'"] .inbox-close-btn');
  if(btn){btn.disabled=true;btn.textContent='…';}
  fetch('https://api.github.com/repos/'+REPO+'/issues/'+number,{
    method:'PATCH',
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({state:'closed'})
  })
  .then(function(r){
    if(r.status===401){invalidToken();throw new Error('skip');}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(){
    var msg=document.querySelector('[data-issue="'+number+'"]');
    if(msg){msg.style.transition='opacity 0.4s';msg.style.opacity='0';setTimeout(function(){
      msg.remove();
      var remaining=document.querySelectorAll('#inbox-list .inbox-msg');
      if(!remaining.length){document.getElementById('inbox-list').innerHTML='<div class="inbox-empty">Нет сообщений</div>';}
    },400);}
    document.getElementById('inbox-badge').style.display='none';
  })
  .catch(function(e){
    if(e.message==='skip')return;
    if(btn){btn.disabled=false;btn.textContent='✓ Архив';}
    alert('Ошибка архивирования: '+e.message);
  });
}

function saveNovinkaEdit(vid,btn){

  btn.disabled=true;btn.textContent='Сохранение…';
  fetch(API+'index.html?ref=main',{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var sha=data.sha;
    var html=b64d(data.content.replace(/\n/g,''));
    var vidIdx=html.indexOf('data-vid="'+vid+'"');
    if(vidIdx===-1)throw new Error('Видео не найдено');
    var se1=html.lastIndexOf('<div class="novinka-card">',vidIdx);
    var se2=html.lastIndexOf('<div class="novinka-card novinka-hidden">',vidIdx);
    var cardStart=Math.max(se1,se2);
    if(cardStart===-1)throw new Error('Карточка не найдена');
    var depth=0,i=cardStart,cardEnd=-1;
    while(i<html.length){
      if(html.slice(i,i+4)==='<div'){depth++;i+=4;}
      else if(html.slice(i,i+6)==='</div>'){depth--;if(depth===0){cardEnd=i+6;break;}i+=6;}
      else{i++;}
    }
    if(cardEnd===-1)throw new Error('Конец карточки не найден');
    var newCard=buildNovinkaCard(poem,vid);
    var newHtml=html.slice(0,cardStart)+newCard+html.slice(cardEnd);
    var encoded=b64e(newHtml);
    return fetch(API+'index.html',{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:'Edit novinka: '+vid,content:encoded,sha:sha,branch:'main'})});
  })
  .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status);});return r.json();})
  .then(function(){
    btn.disabled=false;btn.textContent='Сохранить';
    box.style.display='none';
    setNovinkaStatus('✓ Изменено',true);
    loadNovinkaList();
  })
  .catch(function(e){btn.disabled=false;btn.textContent='Ошибка';setNovinkaStatus('Ошибка: '+e.message);});
}
