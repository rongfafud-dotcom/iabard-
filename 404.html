<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Страница не найдена · Ия Бард</title>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cream:#fdf6ee;--gold:#c9a96e;--plum:#5c3d55;--deep:#1e1220;--mauve:#9c7b8b}
    body{font-family:'Raleway',sans-serif;background:var(--deep);color:var(--cream);
         min-height:100vh;display:flex;flex-direction:column;align-items:center;
         justify-content:center;text-align:center;padding:40px 24px;
         background:url('background.jpg') no-repeat 50% 15%;background-size:cover}
    body::before{content:'';position:fixed;inset:0;
      background:linear-gradient(160deg,rgba(30,18,32,0.72) 0%,rgba(92,61,85,0.62) 50%,rgba(30,18,32,0.78) 100%)}
    .wrap{position:relative;z-index:2;max-width:520px}
    .name{font-family:'Great Vibes',cursive;font-size:clamp(3rem,8vw,5rem);color:#fff;line-height:1;
          margin-bottom:8px;text-shadow:0 4px 24px rgba(201,169,110,0.4)}
    .code{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,12vw,7rem);font-weight:300;
          color:var(--gold);line-height:1;margin:16px 0 8px;opacity:0.85}
    .msg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,2.5vw,1.3rem);
         color:rgba(253,246,238,0.7);line-height:1.6;margin-bottom:32px}
    .rule{width:40px;height:1px;background:var(--gold);opacity:0.45;margin:0 auto 32px}
    .home-btn{display:inline-block;padding:12px 32px;border:1px solid rgba(201,169,110,0.45);
              border-radius:24px;color:var(--gold);text-decoration:none;font-family:'Raleway',sans-serif;
              font-size:0.78rem;letter-spacing:3px;text-transform:uppercase;
              transition:all 0.25s}
    .home-btn:hover{background:rgba(201,169,110,0.12);border-color:var(--gold)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="name">Ия Бард</div>
    <div class="code">404</div>
    <div class="rule"></div>
    <p class="msg">Эта страница не существует…<br>Но поэзия — существует.</p>
    <a href="/" class="home-btn">На главную</a>
  </div>
</body>
</html>
